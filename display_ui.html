<script>
// ============================================================================
// On-screen error handler — shows any uncaught JS error directly on screen
// instead of just the console, since console/devtools access on the actual
// display device (e.g. a TV) usually isn't convenient. Placed here (not in
// index.html) and as the very first thing in this file, so it's REGISTERED
// before DisplayConfig or anything else below gets a chance to throw — but
// the config check inside only runs at error-time, by which point
// DisplayConfig has already been assigned (it's the very next statement
// below), so gating on it here is safe.
// Catches errors from this file, from display_ui.js, and anywhere else on
// the page, since window.onerror is global for the whole document.
//
// Gated by the same DisplayConfig.albumInfo.debug flag as the album-info
// trace (green box) below, despite the name — there's only one debug
// toggle in this project, and it now covers both. Off by default, so an
// unattended TV doesn't show a red banner for something transient; turn it
// on when actively debugging.
// ============================================================================
window.onerror = function (message, source, lineno, colno, error) {
    try {
        if (!window.DisplayConfig || !window.DisplayConfig.albumInfo || !window.DisplayConfig.albumInfo.debug) return false;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;' +
            'background:rgba(150,0,0,0.95);color:#fff;font:14px monospace;' +
            'padding:12px;white-space:pre-wrap;max-height:60vh;overflow:auto;';
        box.textContent = 'JS ERROR: ' + message + '\n' +
            'at ' + source + ':' + lineno + ':' + colno +
            (error && error.stack ? '\n\n' + error.stack : '');
        (document.body || document.documentElement).appendChild(box);
    } catch (e) { }
    return false; // still let it show in console too, if one exists
};

// ============================================================================
// DisplayConfig — single source of truth for tunable parameters shared
// between this file's <style> block (via a generated <style> tag with plain
// literal values — see injectDisplayConfigStyles() below) and display_ui.js
// (JS logic, via window.DisplayConfig — see applyDisplayConfig() there,
// called from within the $("#uiParent").load('display_ui.html', ...)
// callback once this content has actually been injected).
//
// LIVES HERE, NOT IN index.html: putting this in index.html (as a separate
// file, or inlined directly into index.html itself) reliably broke on a
// Google TV / Chromecast receiver — the page hung on the Roon splash screen
// indefinitely, with no visible error, regardless of caching/versioning/
// device restarts tried. index.html is now back to byte-for-byte original.
// display_ui.html, by contrast, has reliably kept working there throughout
// (it's fetched via AJAX and injected into #uiParent, not part of the
// initial page load), so this is where config now lives instead.
//
// NOT CSS custom properties / var(): an earlier version used those, but
// they didn't reliably apply on that same TV's older WebView either
// (buttons silently fell back to unstyled sizes, image filters silently
// didn't apply). Generating a plain <style> tag with values already
// substituted in works everywhere.
// ============================================================================

// ---- Version -----------------------------------------------------------
// x.y, bumped by hand only when told to -- read by admin.js (Version tab)
// via a plain regex on this line, not part of display-defaults.json/the
// reset-to-default mechanism (this isn't a tunable setting).
window.DISPLAY_UI_VERSION = '1.0';

window.DisplayConfig = {

    // ---- Album info overlay ---------------------------------------------
    // sourceOrder: which lookup services to try, in order, when the cover is
    // tapped for info -- the first one that finds a confident match wins,
    // the rest aren't even called. Valid entries: 'discogs', 'itunes',
    // 'deezer'. Leave the array empty ([]) to disable album info lookups
    // entirely (the panel will always show "Album not found."). Remove an
    // entry to disable just that one source without affecting the others'
    // order -- e.g. ['itunes', 'deezer'] tries iTunes then Deezer, never
    // Discogs, regardless of discogsProxyUrl below.
    //
    // debug: when true, logs every step of the whole chain to the console
    // -- which source is being tried, what it searched for, how many
    // candidates came back, why a candidate was accepted/rejected, and
    // exactly when/why it falls through to the next source. This is the
    // way to tell a genuine "no source found anything" apart from a source
    // silently failing and the next one in line happening to succeed. Off
    // by default so the console stays quiet once things are working.
    //
    // discogsProxyUrl: base URL of the local proxy handling Discogs lookups
    // (see roon-local-services/server.js) -- exposes /search?q=... and
    // /release/<id>, both forwarded to api.discogs.com with the token/UA
    // Discogs requires and CORS added, since the Discogs API itself can't
    // be called directly from a browser. Leave this empty ('') to skip
    // Discogs even if 'discogs' is listed in sourceOrder above -- this is
    // the default so the script still works for anyone who hasn't set up
    // their own proxy/token.
    // General-purpose debug logging -- separate from albumInfo.debug above
    // (which is narrowly scoped to album-matching diagnostics + the JS
    // error banner). Two independent channels, either or both can be on:
    // toScreen shows an on-screen overlay (there's no way to open a
    // console on an actual TV); toTerminal POSTs each message to the
    // proxy's /debug-log route, so it shows up in proxy.log on the Mac --
    // readable via `tail -f proxy.log`, no TV-side access needed at all.
    // Both default off so an unattended TV doesn't chatter or show
    // anything -- turn on from the admin panel's Logs tab when actively
    // debugging something.
    debugLogging: {
        toTerminal: false,
        toScreen: false
    },

    albumInfo: {
        sourceOrder: ['discogs', 'itunes', 'deezer'],
        debug: false,
        discogsProxyUrl: '', // set from admin's Network & Maintenance tab (PROXY_HOST) after install -- see its comment above
        // A candidate is rejected outright below these similarity scores,
        // regardless of how well the OTHER dimension matches -- see the
        // full rationale next to where these are consumed, in
        // pickBestAlbum()/pickBestTrack() below. Promoted here from
        // formerly-hardcoded `var` constants so the admin panel's "Data
        // Sources" tab can tune them.
        minArtistSimilarity: 0.25,
        minTitleSimilarity: 0.3
    },

    // ---- AI-generated album review / composition info --------------------
    // Talks only to the local proxy's /ai/* routes (see
    // roon-local-services/ai.js + server.js) -- the TV never calls
    // Claude/ChatGPT directly and no API key ever reaches the client.
    // providersPath returns which provider(s) are actually configured
    // server-side (an API key is present in .env); reviewPath/compositionPath
    // are the two generation endpoints. Same host as albumInfo.discogsProxyUrl
    // today, kept as a separate value since the two could diverge later.
    aiInfo: {
        proxyBaseUrl: '', // set from admin's Network & Maintenance tab (PROXY_HOST) after install, same as albumInfo.discogsProxyUrl above
        providersPath: '/ai/providers',
        reviewPath: '/ai/review',
        compositionPath: '/ai/composition',
        artistPath: '/ai/artist'
    },

    // ---- Central info panel (Album review / Composition text) ------------
    // Geometry only -- see injectDisplayConfigStyles() for how this turns
    // into #centralInfoPanel's actual top/left/right/height-or-bottom. The
    // panel's right edge stops gapFromQueueVw before #queuePanel's own
    // left edge (#queuePanel's width:24vw is a static CSS literal,
    // mirrored by hand in that calculation). Its top edge sits BELOW
    // #clockDisplay (both start at the same screenFrame.marginPercent
    // left/top otherwise) -- topGapBelowClockVh is the extra breathing
    // room under the clock's own estimated height (derived from
    // clock.fontSize), tune this if they still touch.
    centralInfoPanel: {
        gapFromQueueVw: 1.5,
        topGapBelowClockVh: 1.5,
        // null = auto (bottom edge computed to stop right above "Album",
        // the now-playing title line). Set to a fixed 85vh by default
        // instead -- covers the now-playing lines, that's an accepted
        // tradeoff for the taller box. Leave blank in the admin panel's
        // "Box height" field to go back to auto.
        heightVh: 85,
        bodyFontSizeVh: 2.2, // the AI-generated text itself (#centralInfoPanelBody) -- title/fields keep their own fixed sizes, not exposed here
        sourceFontSizeVh: 1.7 // the "Source: ..." footnote line (#centralInfoPanelSource) -- used to just mirror bodyFontSizeVh (see injectDisplayConfigStyles below), split into its own value so it's independently adjustable
    },

    // ---- Colors --------------------------------------------------------
    // accentColor: the single "this function is on" color -- used for
    // #colorbarcontainer's LED gradient (colors.colorBar below) and the
    // plain fallback progress bar (#progressbar, no waveform data
    // available). Deliberately NOT used by the remote control bar's own
    // buttons (.remoteBtn, both rows), their dropdowns
    // (.remoteBtnDropdown), or the queue panel's Shuffle/Loop/Radio icons
    // (.queuePanelToggleIcon.active, #queuePanelRadioIcon.active) -- all
    // of those stay neutral white/black regardless of accentColor, a
    // deliberate choice, not an oversight. NOT applied to the waveform
    // canvas itself either (stays grey/white via its own intensity, see
    // the waveform block above).
    // Currently blue — named generically since this could become any color.
    colors: {
        accentColor: 'rgb(0, 150, 255)',
        // #colorbarcontainer's own LED-style gradient, entirely a function
        // of accentColor (see accentRgba() below) at these three opacities
        // -- used to have a fixed secondary blue hardcoded at the inner
        // stops regardless of accentColor, removed so this is genuinely
        // just "the accent color, three opacities" now. innerStopPct is
        // the position of the inner stops (today's 25%/75%, mirrored
        // symmetrically); the center (50%) is always fully transparent,
        // not exposed -- that's what gives the "opens up in the middle"
        // reveal effect and isn't meant to be adjustable.
        colorBar: {
            edgeOpacity: 0.55,
            innerStopPct: 0.25,
            innerOpacity: 0.25
        },
        // Backdrop box behind the whole remote control bar (#remoteControlBar,
        // both rows) -- always neutral black, never accent-tinted, same
        // reasoning as .remoteBtnDropdown's own background (see that
        // element's comment): the remote-control chrome stays neutral so
        // it doesn't visually compete with whatever accent color is set.
        controlBarBackground: {
            opacity: 0.5
        },
        queuePanelBackground: {
            // Derived from accentColor's own hue, tuned by just these two knobs
            // — no separate color to keep in sync by hand:
            brightness: 0.5, // 0-1 multiplier on accentColor's R/G/B before applying
                              // opacity — 1 = same brightness as the LEDs/buttons, lower
                              // darkens it. A big panel behind lots of text reads better
                              // darkened than at full LED brightness.
            opacity: 0.6    // alpha of the (already-darkened) color over whatever's behind
                              // -- raised from 0.3: with #centralInfoPanel now holding real
                              // paragraphs of AI-generated text (not just short queue rows),
                              // the lower opacity made it hard to read over busy album art.
                              // Shared by #queuePanel, #centralInfoPanel, and #aiAgentDropdown.
        },
        dimmingOverlayColor: 'rgb(20, 19, 19)' // #background-dimming — fades in over the
            // blurred album backdrop whenever the artist-art carousel has no photo to show
            // (toggles opposite to the artist photo via setBackgroundDimmingVisibility()).
            // This is what reads as "black" during that rotation; currently near-black,
            // named generically since it could become any color. No longer carries its own
            // alpha (Enrico: "tengo sempre alpha impostato su 1") -- always fully opaque here;
            // #albumInfoContent's own opacity (albumCover.infoBackOpacity below) is separate.
    },

    // ---- Screen edge frame ------------------------------------------------
    // Single shared margin representing how far screen-edge-anchored
    // elements sit from the true viewport edge: album art, #infocontainer
    // (now-playing text + progress area), the clock, and #queuePanel all use
    // this one value now — #queuePanel used to be separate (top:5vh,
    // right:3vw), now unified here too.
    screenFrame: {
        marginPercent: 2
    },

    // ---- Decorative clock (top-left, hh:mm, 24h) ----------------------------
    // Roboto Mono: a monospace face, loaded via @import in the <style> block
    // below (not index.html, which stays untouched) since it's not one of
    // the fonts index.html's own <link> tags fetch. Monospace digits read
    // cleanly at a clock's typical square-ish proportions, and Roboto Mono's
    // zero is a plain rectangle (no slash/dot), which is the "squared off"
    // look that was asked for. Weight 200 is thinner than the 300 used
    // before, and is actually loaded (unlike a plain "Lato" 300, which
    // index.html's Lato <link> never fetches -- CSS can request a weight
    // that was never downloaded, and the browser just silently renders the
    // nearest one it has, normal/400 in that case).
    //
    // Alternative monospace fonts, if you want a different feel -- swap
    // fontFamily below AND update the @import URL a few lines down in the
    // <style> block (same family name, comma-separated weights) or the
    // clock will silently fall back to whatever's already loaded:
    //   - "Roboto Mono"    -- current. Clean, geometric, rectangular zero.
    //   - "JetBrains Mono" -- similar squared-off zero, slightly more open/airy letterforms.
    //   - "IBM Plex Mono"  -- a bit more "technical/corporate" looking, still rectangular zero.
    //   - "Space Mono"     -- quirkier, more rounded/retro character shapes -- zero less strictly rectangular.
    //   - "Source Code Pro" -- classic coding-editor font, rectangular zero, slightly narrower.
    //   - "monospace"      -- the generic system fallback (no @import needed) if you'd
    //                         rather not load a webfont at all -- whatever monospace font
    //                         the device already has installed, look varies by device.
    clock: {
        enabled: true,   // set false to turn the clock off entirely
        showDate: false, // appends " Ddd d Mmm" (e.g. " Lun 11 Ago") after the time
        hour12: false,   // false = 24h (e.g. 14:05), true = 12h with AM/PM (e.g. 2:05 PM)
        fontSize: '2.5vh',
        fontFamily: '"Roboto Mono", monospace',
        fontWeight: '200'
    },

    // ---- Queue panel behavior -----------------------------------------------
    queueBehavior: {
        openByDefault: false // true = queue panel is already open when the page loads,
                             // instead of waiting for the Queue button to be pressed
    },

    // ---- Now-playing 3-line text block ----------------------------------
    // Order top-to-bottom: Album, Title, Credits. Each line also has its own
    // opacity (1 = fully visible, 0 = hidden) -- since each is positioned
    // with a fixed top, hiding one via opacity leaves its space reserved;
    // the other two lines don't shift to fill the gap.
    nowPlayingLines: {
        // visible (admin's "Three text lines" checkboxes, Enrico's request):
        // true (default, today's look) shows the line as usual; false hides
        // its container entirely (display:none) -- Roon's own script still
        // writes whatever text it wants into the hidden container, nothing
        // about that changes, it just isn't rendered. Deliberately no
        // repositioning of the other two lines when one is hidden (Enrico:
        // "va bene lo spazio vuoto") -- each line's own top/height stays
        // exactly where it already was.
        album:   { top: '-6.45vh', height: '4.5vh', fontSize: '3.2vh', opacity: 1, visible: true },
        title:   { top: '0vh',     height: '6.5vh', fontSize: '4vh',   opacity: 1, visible: true },
        credits: { top: '5.2vh',   height: '4.5vh', fontSize: '3.2vh', opacity: 1, visible: true }
    },

    // ---- Bottom control bar (Previous/Rewind/Play-Pause/FF/Next/Queue) ---
    controlBar: {
        position: 'centered', // top:50%/left:50%/translate(-50%,-50%) — documents intent,
                               // not itself read anywhere; the centering is inherent to
                               // how top/left/transform are written in the CSS
        buttonSize: '5.6vh',  // width/height of each circular button
        buttonGap: '1.75vh'   // spacing between buttons
    },

    // ---- Album cover (#albumart, the sharp foreground cover) --------------
    // Two separate values, not one "size": maxHeightVh is a ceiling the box
    // won't exceed, but widthPercent is what actually determines the
    // rendered cover size on a typical 16:9 screen -- 32% of viewport width
    // works out smaller than 80vh of viewport height, so width is the real
    // bottleneck (background-size:contain shrinks to fit the tighter of the
    // two). Changing maxHeightVh alone won't visibly change anything unless
    // it's brought below what widthPercent already produces.
    // Position (left/bottom -- the "padding" from the screen edge) stays a
    // hand-written literal in the CSS, not parametrized here, per request.
    albumCover: {
        maxHeightVh: 80,  // was height:80% (viewport-relative %, now vh) -- a ceiling, not the effective size
        widthPercent: 32, // the value that actually drives the rendered cover size today
        // #albumInfoContent's own background opacity -- separate from
        // dimmingOverlayColor's own alpha (removed, always opaque now).
        // 1 = fully opaque (today's look, unchanged); lower lets the front
        // cover art underneath show through the "back" panel (Enrico: "se
        // meno di 1, vorrei che quando mostro il retro si intraveda il
        // front"). The panel's TEXT stays fully opaque regardless -- only
        // the background behind it is affected, via a runtime rgba() built
        // from dimmingOverlayColor's RGB plus this value (see
        // injectDisplayConfigStyles below).
        infoBackOpacity: 0.8
    },

    // ---- Queue panel -----------------------------------------------------
    // maxHeight is DERIVED below (see the calculation after this object),
    // not hand-set — change desiredVisibleRows and it recalculates, instead
    // of needing a fresh magic-number re-derivation by hand each time.
    queuePanel: {
        desiredVisibleRows: 7,
        rowHeightVh: 7.2,     // 4.6vh art icon + 2.6vh row padding, per .queueItem
        headerHeightVh: 8.54, // #queuePanelHeader's own vertical footprint: 0.3 (padding-top)
                               // + ~2.28 (text row, 1.9vh font * ~1.2 line-height) + 1 (row
                               // gap) + 3.36 (icon row) + 1.6 (padding-bottom)
        listPaddingVh: 0.8,   // #queueList's own top+bottom padding
        headerIconGap: '0.6vh',   // gap between the loop/shuffle/radio trio
        radioSlotWidth: '4.5vh',  // matches .queueItemDuration's width below, so the
                                   // radio icon's position lines up with the duration
                                   // column in every row beneath it
        verticalPadding: '1.2vh', // space above the header text and below the last
                                   // visible track, so neither sits flush against the
                                   // panel edge
        borderRadius: '2.4vh'     // was 1.2vh, doubled per request
    },

    // ---- Remote / keyboard behavior --------------------------------------
    remote: {
        seekSecondsBase: 2,     // Rewind/Fast-Forward tap step size
        holdThresholdMs: 350,   // how long a hold must last before continuous seek starts
        holdRepeatMs: 300,      // repeat interval once continuous seek has started
        holdAccelDurationMs: 10000, // time to ramp from seekSecondsBase up to holdSeekMax
        holdSeekMax: 10,        // seconds per step once fully ramped up
        barAutoHideMs: 5000     // control bar auto-hide timeout -- also shared by the Refresh/AI Agent/Artist dropdowns' own auto-close timers (see their armXHideTimer functions), so this one value covers every timed auto-close in the remote control area
    },

    // ---- Waveform + progress bar ------------------------------------------
    // Neither canvas layer's color follows colors.accentColor -- that was
    // tried (foreground -> accent) and reverted per request; both stay
    // grey/white via their own intensity values below. The accent color
    // shows up elsewhere instead: #colorbarcontainer (colors.colorBar,
    // further down in this file) is the one waveform-area element that
    // does follow the global accent.
    waveform: {
        barSizePct: 0.9,       // fraction of the bar-to-bar STEP drawn as a bar (rest is
                                // gap) -- NOT a fraction of the bar's own final width. The
                                // bar's own width stays close to pixelRatio regardless of
                                // this value; what changes is how much empty space
                                // surrounds it. See barPixelRatio below for the other half
                                // of this formula.
        intensity: 200,        // grey value (0-255) of the FOREGROUND waveform bars
        barPixelRatio: 2,      // used ONLY for the bar-width/spacing formula above -- a
                                // separate value from the real device pixel ratio (which
                                // canvas resolution itself always uses, via getPixelRatio()
                                // in display_ui.js, unaffected by this). 2 is a plausible
                                // real-world value, not tied to auto-detecting anything.
        cornerRadiusPct: 0.5,  // 0-0.5, fraction of the bar's OWN rendered width (0.5 =
                                // fully rounded/capsule shape) -- shared by background AND
                                // foreground bars (drawn from the same loop, same shape).
                                // Deliberately relative to bar width, not an absolute pixel
                                // value, so it looks the same regardless of how
                                // barPixelRatio/barSizePct end up sizing the bars. 0 = sharp
                                // rectangles, the original look.
        transitionSeconds: 1,  // CSS transition duration for the smooth width-based
                                // progress reveal -- was a literal "1s" before this
        // Foreground per-bar vertical luminance gradient (edge is always
        // fully opaque, not exposed -- only these two vary).
        gradient: {
            firstStep: 0.4,      // position of the first luminance gradient stop (0-1)
            firstOpacity: 0.2,   // opacity at that first stop
            centerOpacity: 1   // opacity at the vertical center
        },
        // Background per-bar vertical gradient -- same shape as above, own
        // values, own fixed grey (220,220,220). All three opacities
        // default equal (0.2) so this renders identically to the old flat
        // single-color fill until deliberately adjusted -- unlike the
        // foreground, the background's edge opacity IS its own separate
        // adjustable value (not fixed at 1).
        background: {
            edgeOpacity: 0.2,
            firstStep: 0.2,
            firstOpacity: 0.2,
            centerOpacity: 0.2
        },
        timeOffsetSeconds: 1,     // "target position reached by the next read, ~1s later" —
                                   // the +1s lead you noticed; this is that value. Only
                                   // affects the bar's own rendered position (added directly
                                   // in the width formula), never the progresstime text.
        displayDelaySeconds: 0  // shifts seek_position forward before it's used for BOTH
                                   // the progresstime text AND the bar's progress % -- despite
                                   // the similar-sounding name, this is not the same kind of
                                   // "bar-only" offset as timeOffsetSeconds above.
    },

    // ---- Image filters (saturation / contrast / brightness / hue-rotate) --
    // These are duplicated today between the CSS filter: declarations and
    // ANTI_RETENTION_FILTERS' "end" state in display_ui.js — centralizing
    // here is what keeps those two in sync going forward. "peak" (the
    // brightness/contrast spike mid-sweep) stays defined in display_ui.js
    // itself, since it's animation-specific, not a steady-state look.
    imageFilters: {
        albumArt: {              // #albumart — sharp foreground cover, no hue-rotate
            saturate: '100%',
            contrast: '90%',
            brightness: '70%'
        },
        backgroundAlbumArt: {    // #background-albumart — the blurred amber backdrop
                                  // (despite the "albumart" name, this is the blurred one)
            sepia: '100%',
            saturate: '200%',
            hueRotate: '0.4turn',
            contrast: '70%',
            brightness: '30%'
        },
        artistArt: {              // #background-artistart div only — the sharp/carousel
                                   // variant actually in use; #background-artistart-blurred
                                   // is unused and intentionally left out
            saturate: '10%',
            contrast: '70%',
            brightness: '50%'
        }
    }
};

// Parses numeric r/g/b out of colors.accentColor (e.g. 'rgb(0, 150, 255)'),
// needed for building rgba(...) strings at different alphas (pressed states,
// LED gradient stops) and for the queue panel background's brightness
// multiplier — all done as plain string concatenation in
// injectDisplayConfigStyles() below, not via CSS custom properties.
(function deriveAccentColorRgb() {
    var m = /(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(window.DisplayConfig.colors.accentColor);
    var r = m ? parseInt(m[1], 10) : 0;
    var g = m ? parseInt(m[2], 10) : 150;
    var b = m ? parseInt(m[3], 10) : 255;
    window.DisplayConfig.colors.accentColorRgb = { r: r, g: g, b: b };
})();

// maxHeight = header + (desired rows * row height) + list padding + panel's
// own top/bottom padding (×2). desiredVisibleRows was dropped to 7 (from 8)
// specifically so this total stays safely below the old no-padding 66.94vh
// baseline -- adding the padding back in without that margin let a 9th
// row's fragment peek through the bottom fade zone last time.
(function computeQueuePanelMaxHeight() {
    var qp = window.DisplayConfig.queuePanel;
    var verticalPaddingVh = parseFloat(qp.verticalPadding);
    var totalVh = qp.headerHeightVh + (qp.desiredVisibleRows * qp.rowHeightVh) + qp.listPaddingVh + (verticalPaddingVh * 2);
    qp.maxHeight = totalVh.toFixed(2) + 'vh';
})();

// Builds a full `filter:` shorthand string from an imageFilters.* entry.
// Shared by the CSS injection below AND by ANTI_RETENTION_FILTERS in
// display_ui.js (which calls this directly) — so the sweep animation's
// resting state can never drift from what the CSS itself shows.
window.DisplayConfig.buildFilterString = function buildFilterString(f) {
    var parts = [];
    if (f.sepia != null) parts.push('sepia(' + f.sepia + ')');
    if (f.saturate != null) parts.push('saturate(' + f.saturate + ')');
    if (f.hueRotate != null) parts.push('hue-rotate(' + f.hueRotate + ')');
    if (f.contrast != null) parts.push('contrast(' + f.contrast + ')');
    if (f.brightness != null) parts.push('brightness(' + f.brightness + ')');
    return parts.join(' ');
};

// Generates a plain CSS string (no var()/custom properties at all) from the
// values above, and injects it as a <style> tag. Placed after this file's
// own <style> block in the DOM (see below), so same-specificity selectors
// here win by source order.
(function injectDisplayConfigStyles() {
    var cfg = window.DisplayConfig;
    var rgb = cfg.colors.accentColorRgb;
    var accent = cfg.colors.accentColor;
    var accentRgba = function (alpha) { return 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', ' + alpha + ')'; };
    // #albumInfoContent's own background: dimmingOverlayColor's RGB
    // (always opaque on its own now, see colors.dimmingOverlayColor's own
    // comment) combined with albumCover.infoBackOpacity, which is what's
    // actually adjustable here -- lets the front cover art show through
    // the "back" panel when lowered below 1, without affecting
    // #background-dimming (the artist-art carousel fade), which stays
    // fully opaque regardless.
    var dimMatch = /(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(cfg.colors.dimmingOverlayColor || '');
    var albumInfoBg = dimMatch

/* ============================================================
   Remote-control playback bar (center of screen)
   Minimalist/glassy: no background box, no borders — just icons
   with a soft drop-shadow for legibility over any artwork.
   ============================================================ */

   its row1 counterpart, column for column, with no extra math needed. */

    flex-direction: column;
    align-items: flex-end;
    gap: 1.75vh; /* default -- see display_config.js controlBar.buttonGap; overridden at runtime.

    padding: 1.5vh 1.5vw; /* breathing room around the buttons inside the backdrop box below -- fixed, not configurable */
    background: rgba(0, 0, 0, 0.5); /* default -- see display_config.js colors.controlBarBackground.opacity; overridden at runtime */
    border-radius: 2.4vh; /* default -- see display_config.js queuePanelBackground.borderRadius (shared value); overridden at runtime */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;

#remoteControlBar.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;

<script>
(function () {
    "use strict";

    var controlBar = document.getElementById('remoteControlBar');
    var queuePanel = document.getElementById('queuePanel');
    var queueList = document.getElementById('queueList');
    var btnQueue = document.getElementById('remoteBtnQueue');
    var iconPlay = document.getElementById('remoteIconPlay');
    var iconPause = document.getElementById('remoteIconPause');
    var albumArt = document.getElementById('albumart');
    var albumInfoOverlay = document.getElementById('albumInfoOverlay');
    var albumInfoContent = document.getElementById('albumInfoContent');
    var centralInfoPanel = document.getElementById('centralInfoPanel');
    var centralInfoPanelTitle = document.getElementById('centralInfoPanelTitle');
    var centralInfoPanelFields = document.getElementById('centralInfoPanelFields');
    var centralInfoPanelField1Label = document.getElementById('centralInfoPanelField1Label');
    var centralInfoPanelField1Value = document.getElementById('centralInfoPanelField1Value');
    var centralInfoPanelField2Label = document.getElementById('centralInfoPanelField2Label');
    var centralInfoPanelField2Value = document.getElementById('centralInfoPanelField2Value');
    var centralInfoPanelField3Row = document.getElementById('centralInfoPanelField3Row');
    var centralInfoPanelField3Label = document.getElementById('centralInfoPanelField3Label');
    var centralInfoPanelField3Value = document.getElementById('centralInfoPanelField3Value');
    var centralInfoPanelBody = document.getElementById('centralInfoPanelBody');
    var centralInfoPanelSource = document.getElementById('centralInfoPanelSource');
    var btnAlbumReview = document.getElementById('remoteBtnAlbumReview');
    var btnComposition = document.getElementById('remoteBtnComposition');
    var btnRefresh = document.getElementById('remoteBtnRefresh');
    var btnAiAgent = document.getElementById('remoteBtnAiAgent');
    var aiAgentDropdown = document.getElementById('aiAgentDropdown');
    var aiAgentDropdownEmpty = document.getElementById('aiAgentDropdownEmpty');
    var aiAgentDropdownList = document.getElementById('aiAgentDropdownList');
    var refreshDropdown = document.getElementById('refreshDropdown');
    var refreshDropdownList = document.getElementById('refreshDropdownList');
    var btnArtist = document.getElementById('remoteBtnArtist');
    var artistDropdown = document.getElementById('artistDropdown');
    var artistDropdownList = document.getElementById('artistDropdownList');

    // Two rows now (see #remoteControlBarRow1/2 markup): row1 keeps the
    // original 5 playback buttons untouched, row2 holds Queue + the new
    // Artist / Album / Composition / Refresh / AI agent buttons -- 6
    // buttons, one more than row1's 5, so with align-items:flex-end the
    // rightmost 5 of row2 line up under row1 and row2's extra leftmost
    // button (Artist) pokes out past row1's left edge (see colInOtherRow
    // below, which maps asymmetric row lengths generally). All the old
    // flat `buttons`/`focusedIndex` machinery is now (row, col) based --
    // ROWS[0] === ROW1, ROWS[1] === ROW2.
    var ROW1 = [
        document.getElementById('remoteBtnPrompt'),
        document.getElementById('remoteBtnPrevious'),
        document.getElementById('remoteBtnRewind'),
        document.getElementById('remoteBtnPlayPause'),
        document.getElementById('remoteBtnFastForward'),
        document.getElementById('remoteBtnNext')
    ];
    var ROW2 = [
        document.getElementById('remoteBtnQueue'),
        document.getElementById('remoteBtnArtist'),
        document.getElementById('remoteBtnAlbumReview'),
        document.getElementById('remoteBtnComposition'),
        document.getElementById('remoteBtnRefresh'),
        document.getElementById('remoteBtnAiAgent')
    ];
    var ROWS = [ROW1, ROW2];

    var PREVIOUS_INDEX = 0;
    var REWIND_INDEX = 1;
    var PLAYPAUSE_INDEX = 2;
    var FASTFORWARD_INDEX = 3;
    var NEXT_INDEX = 4; // all row 0 (ROW1) -- media keys never target row2
    var QUEUE_ROW = 1;
    var QUEUE_COL = 0;
    var ARTIST_COL = 1;
    var ALBUM_REVIEW_COL = 2;
    var COMPOSITION_COL = 3;
    var REFRESH_COL = 4;
    var AI_AGENT_COL = 5;

    // General mapping for align-items:flex-end with two rows of possibly
    // different lengths: their RIGHT edges line up, so column c in the row
    // you're leaving maps to (c - (fromLen - toLen)) in the other row,
    // clamped to a valid column there. With equal lengths this reduces to
    // the old identity mapping; with row2 one longer than row1 (now), row1
    // col0 (Previous) maps to row2 col1 (Artist) and back, and row2's
    // col0 (Queue) -- the one with no row1 counterpart -- clamps to row1's
    // col0 (Previous) when moving up.
    function colInOtherRow(col, fromRow) {
        var fromLen = ROWS[fromRow].length;
        var toLen = ROWS[1 - fromRow].length;
        var mapped = col - (fromLen - toLen);
        return Math.max(0, Math.min(mapped, toLen - 1));
    }

    // If window.DisplayConfig is missing, this throws here and halts the
    // rest of this script -- deliberately (see the matching note in
    // display_ui.js). No remote-control buttons get wired up, and the page
    // stays on the Roon splash instead of silently running with defaults.
    var _remoteCfg = window.DisplayConfig.remote;

    var SEEK_SECONDS = _remoteCfg.seekSecondsBase; // Rewind/Fast-Forward step size

    // Both meaningful only when focusZone === 'bar'; start on Queue (row2,
    // col0) the first time the bar is ever revealed.
    var focusedRow = QUEUE_ROW;
    var focusedCol = QUEUE_COL;
    var barVisible = false;
    var queueOpen = false;
    var focusZone = 'bar';     // 'bar' | 'queue' — which surface Up/Down/Enter/Left/Right act on
    var hideTimer = null;
    var queueSubscription = null;

    // Album cover focus/info-overlay state. Deliberately independent of
    // focusZone/barVisible above: the album cover is only ever reachable via
    // Left/Right while the bottoni bar is hidden and the queue isn't open
    // (see the ArrowLeft/ArrowRight handling below) — never a stop inside
    // the bar's own button ring.
    var albumFocused = false;  // true while the remote's D-pad focus sits on the cover (white ring)
    var albumInfoOpen = false; // true while the info overlay is showing instead of the cover art
    var albumInfoCache = {};   // "artist|album" (lowercased) -> parsed iTunes result, or null if no match/error
    var lastAlbumInfoFingerprint = null; // nowPlayingFingerprint() at last refresh, to auto-update the open panel on track change

    // #centralInfoPanel state (Album review / Composition, AI-generated).
    // infoBoxOpen/infoBoxFocused are deliberately two separate flags (see
    // the Enter handler below): closing the D-pad ring focus on the panel
    // does NOT close the panel itself -- only the row2 buttons toggle
    // infoBoxOpen. Independent of albumFocused/albumInfoOpen above -- no
    // mutual exclusion between any of these overlays, per request.
    var infoBoxOpen = false;
    var infoBoxFocused = false;
    var infoBoxKind = null;       // 'review' | 'composition' -- which button opened it, decides what to render/fetch

    // Disambiguation mode (admin's "Disambiguation during text generation"
    // checkboxes, server.js's disambiguationInstruction): when a response
    // comes back {ambiguous: true, candidates: [...]}, the panel shows
    // these as a pick-list instead of the generated text, reusing the
    // SAME Up/Down/Enter that normally scroll/open-controls on the
    // already-focused panel (see the ArrowUp/ArrowDown/Enter cases below)
    // -- no separate dropdown/focus zone, per request. null when not in
    // this mode; an array (always with a final "None of these" entry
    // appended) while it is. disambiguationContext remembers what a
    // chosen candidate needs to re-request against, since selecting one
    // triggers a second real refreshCentralInfoPanel call.
    var disambiguationCandidates = null;
    var disambiguationFocusIndex = 0;
    var disambiguationContext = null; // { names, kind } captured when candidates were shown

    // Client-side in-memory cache (aiTextCache) removed -- every open/
    // switch/refresh is now a real request to the proxy, which has its own
    // persistent cache (ai-cache.json) that responds fast anyway (a plain
    // JSON lookup, not a real generation, on a hit). Keeping two caches in
    // sync (this one, and the server's) became more maintenance than it
    // was worth once the server side gained real per-field normalization
    // rules (config.json's keyNormalizationRules) -- one cache, one set of
    // rules, nothing to keep aligned by hand.

    // AI agent dropdown state (#aiAgentDropdown, focusZone 'aiDropdown').
    var aiProviders = [];          // from GET /ai/providers, in server (PROVIDER_DEFS) order -- fetched once, cached in memory
    var aiProvidersFetched = false;
    var selectedProviderId = null; // null = no explicit choice yet this session -> aiProviders[0] (the default) is used
    var aiFocusIndex = 0;          // index into aiProviders, valid only while focusZone === 'aiDropdown'
    var aiHideTimer = null;
    var REFRESH_OPTIONS = [
        { id: 'cache', label: 'Retrieve from cache' }, // default focus -- still contacts the server (current context may differ from what's on screen, e.g. track changed), just doesn't force the server to bypass ITS OWN cache
        { id: 'web', label: 'Generate (based on settings)' },   // forces the server to bypass its cache and regenerate for real, using whatever Web searches mode (never/when useful/always) is configured in admin
        { id: 'forceWeb', label: 'Generate (at least 1 web search)' }, // same, but additionally forces at least one real web search for THIS generation only, even if Web searches is set to Never -- the global setting itself is untouched, and the max-searches cap from admin still applies
        { id: 'clear', label: 'Clear' } // overwrites the cache with a fixed "could not generate" placeholder, no AI call at all -- for when the current text is nonsensical and regenerating risks producing the same nonsense again
    ];
    var refreshFocusIndex = 0;     // index into REFRESH_OPTIONS, valid only while focusZone === 'refreshDropdown'
    var refreshHideTimer = null;

    // Artist picker dropdown state (#artistDropdown, focusZone 'artistDropdown').
    // Unlike the AI agent dropdown, this is a one-shot picker, not a
    // sticky preference: selecting an entry immediately opens that
    // artist's info and closes the dropdown -- no check mark, nothing
    // persists here between opens.
    var artistOptions = [];        // names split from the current track's artist string, only valid while the dropdown is open
    var artistFocusIndex = 0;
    var artistHideTimer = null;
    var selectedArtistName = null; // which artist #centralInfoPanel is currently showing, valid only while infoBoxKind === 'artist'

    function currentZone() {
        if (!window.roonCore || window.zoneid == null) return null;
        return window.roonCore.services.RoonApiTransport.zone_by_zone_id(window.zoneid);
    }

    function applyBarFocusVisual() {
        ROWS.forEach(function (row, r) {
            row.forEach(function (b, c) {
                if (r === focusedRow && c === focusedCol) {
                    b.classList.add('focused');
                    b.focus();
                } else {
                    b.classList.remove('focused');
                }
            });
        });
    }

    // Horizontal ring within whichever row currently has focus. The queue
    // is opened/closed exclusively via the Queue button (Enter/click on
    // it) — it is not a stop in this ring, and Left/Right never opens or
    // closes it.
    function stopCount() {
        return ROWS[focusedRow].length;
    }

    // Replaces the old flat buttons.forEach(...remove 'focused'...) used in
    // several places below when leaving the bar for the queue/album/infobox.
    function clearAllButtonFocus() {
        ROWS.forEach(function (row) {
            row.forEach(function (b) { b.classList.remove('focused'); });
        });
    }

    function goToStop(row, col) {
        var total = ROWS[row].length;
        var stop = ((col % total) + total) % total;
        focusZone = 'bar';
        focusedRow = row;
        focusedCol = stop;
        showControlBar();
        applyBarFocusVisual();
        applyRowFocusClass(); // clears any lingering row highlight in the queue
    }

    // Up/Down while the bar is visible: swap between row1/row2, landing on
    // the visually closest column (colInOtherRow, see its own comment near
    // ROWS above). With only two rows this both keys always just swap --
    // that already IS the "infinite loop" per request.
    function swapControlBarRow() {
        var otherRow = 1 - focusedRow;
        focusedCol = colInOtherRow(focusedCol, focusedRow); // already clamped internally
        focusedRow = otherRow;
        applyBarFocusVisual();
    }

    // Used for dedicated remote transport keys (play/pause/ff/rewind/skip):
    // updates which button *would* be focused, without revealing the bar.
    // If the bar happens to already be visible, its visual is kept in sync;
    // otherwise it stays hidden/transparent, as requested. Always row1 --
    // media keys never target row2.
    function updateBarFocusSilently(col) {
        // Only sync the stored/visible focus if the bar is actually up —
        // otherwise this silently overwrites what the bar will show the
        // *next* time it's genuinely revealed via D-pad, which is exactly
        // what caused the wrong default on first-ever reveal.
        if (barVisible) {
            focusZone = 'bar';
            focusedRow = 0;
            focusedCol = col;
            applyBarFocusVisual();
        }
    }

    // Leaving the queue lands on *nothing* — no button focused, bar hidden —
    // so the very next click/key press acts purely as a reveal (matching the
    // normal "first remote hit just brings up the controls" behavior),
    // rather than immediately focusing/activating anything.
    function loseFocusToNeutral() {
        focusZone = 'bar';
        clearAllButtonFocus();
        applyRowFocusClass(); // clears the queue row highlight
        hideControlBar();
    }

    function showControlBar() {
        clearTimeout(hideTimer);
        if (!barVisible) {
            barVisible = true;
            controlBar.classList.add('visible');
            if (focusZone === 'bar') applyBarFocusVisual();
        }
        // Bottom control bar (Previous/Rewind/Play-Pause/FF/Next/Queue)
        // auto-hides after this many ms of no interaction with it.
        hideTimer = setTimeout(hideControlBar, _remoteCfg.barAutoHideMs);
    }

    function hideControlBar() {
        clearTimeout(hideTimer);
        barVisible = false;
        controlBar.classList.remove('visible');
    }

    function doControl(control) {
        var zone = currentZone();
        if (zone && window.roonCore) {
            window.roonCore.services.RoonApiTransport.control(zone, control);
        } else {
            console.warn('[remote-control] could not send "' + control + '" — roonCore:',
                !!window.roonCore, 'zoneid:', window.zoneid, 'zone:', zone);
        }
    }

    function doSeek(deltaSeconds) {
        var zone = currentZone();
        if (zone && window.roonCore) {
            window.roonCore.services.RoonApiTransport.seek(zone, 'relative', deltaSeconds);
        } else {
            console.warn('[remote-control] could not seek — roonCore:',
                !!window.roonCore, 'zoneid:', window.zoneid, 'zone:', zone);
        }
    }

    function flashButtonPress(btn) {
        if (!btn) return;
        btn.classList.add('pressed');
        setTimeout(function () { btn.classList.remove('pressed'); }, 150);
    }

    function activateFocused() {
        var btn = ROWS[focusedRow][focusedCol];
        flashButtonPress(btn);
        if (btn === btnQueue) {
            toggleQueue();
        } else if (btn.id === 'remoteBtnPrevious') {
            doControl('previous');
        } else if (btn.id === 'remoteBtnRewind') {
            doSeek(-SEEK_SECONDS);
        } else if (btn.id === 'remoteBtnPlayPause') {
            doControl('playpause');
        } else if (btn.id === 'remoteBtnFastForward') {
            doSeek(SEEK_SECONDS);
        } else if (btn.id === 'remoteBtnNext') {
            doControl('next');
        } else if (btn.id === 'remoteBtnArtist') {
            handleArtistButtonPress();
        } else if (btn.id === 'remoteBtnAlbumReview') {
            toggleCentralInfoPanel('review');
        } else if (btn.id === 'remoteBtnComposition') {
            toggleCentralInfoPanel('composition');
        } else if (btn.id === 'remoteBtnRefresh') {
            openRefreshDropdown();
        } else if (btn.id === 'remoteBtnAiAgent') {
            openAiAgentDropdown();
        } else if (btn.id === 'remoteBtnPrompt') {
            togglePromptView();
        }
    }

    function imageUrl(imageKey, size) {
        if (!imageKey || !window.roonIp || !window.roonPort) return null;
        return 'http://' + window.roonIp + ':' + window.roonPort + '/api/image/' + imageKey +
            '?scale=fit&width=' + size + '&height=' + size;
    }

    // ---- Album cover: focus (remote) + click-to-toggle info overlay ----

    // Gated by DisplayConfig.albumInfo.debug (off by default) -- every
    // console.log in the album-info pipeline below goes through this, so
    // flipping that one flag shows the full trace (which source is tried,
    // what was searched, why a candidate was accepted/rejected, and when/
    // why it falls through to the next source) without touching code.
    // On-screen debug box, lazily created -- reuses the same rationale as
    // the window.onerror banner at the top of this file: console/devtools
    // access on the actual display device (Google TV) isn't practical, so
    // when debug is on the trace needs to be visible directly on screen,
    // not just in a console nobody on that device can open.
    var albumInfoDebugBox = null;
    function albumInfoDebugLog() {
        var cfg = window.DisplayConfig.albumInfo;
        if (!cfg || !cfg.debug) return;
        var args = Array.prototype.slice.call(arguments);
        console.log.apply(console, ['[album-info]'].concat(args));
        if (!albumInfoDebugBox) {
            albumInfoDebugBox = document.createElement('div');
            // Right-side, full height -- leaves the bottom-left cover
            // (and its info overlay) fully visible so the log can be read
            // side-by-side against what's actually on screen, instead of
            // covering it. Smaller font + full height fits far more lines
            // without truncating the tail end of a search.
            albumInfoDebugBox.style.cssText = 'position:fixed;top:0;bottom:0;left:42%;right:0;' +
                'overflow:auto;z-index:999998;box-sizing:border-box;' +
                'background:rgba(0,0,0,0.85);color:#7fff7f;font:1vh/1.3 monospace;' +
                'padding:0.6vh;white-space:pre-wrap;pointer-events:none;';
            (document.body || document.documentElement).appendChild(albumInfoDebugBox);
        }
        var line = document.createElement('div');
        line.textContent = args.map(function (a) {
            return typeof a === 'string' ? a : JSON.stringify(a);
        }).join(' ');
        albumInfoDebugBox.appendChild(line);
        while (albumInfoDebugBox.childNodes.length > 200) albumInfoDebugBox.removeChild(albumInfoDebugBox.firstChild);
        albumInfoDebugBox.scrollTop = albumInfoDebugBox.scrollHeight;
    }

    // ---- General-purpose debug logging (DisplayConfig.debugLogging) -------
    // Separate from albumInfoDebugLog above (which is narrowly scoped to
    // the album-matching pipeline) -- this is for anything else worth
    // tracing (e.g. the D-pad/focus state machine). Bottom strip, not the
    // album-info box's right-side placement, so the two don't visually
    // collide if both happen to be on at once.
    var remoteDebugBox = null;
    function remoteDebugLog(message) {
        var cfg = window.DisplayConfig.debugLogging;
        if (!cfg) return;
        if (cfg.toScreen) {
            if (!remoteDebugBox) {
                remoteDebugBox = document.createElement('div');
                remoteDebugBox.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:30vh;' +
                    'overflow:auto;z-index:999997;box-sizing:border-box;' +
                    'background:rgba(0,0,0,0.85);color:#7fff7f;font:1.3vh/1.4 monospace;' +
                    'padding:0.6vh;white-space:pre-wrap;pointer-events:none;';
                (document.body || document.documentElement).appendChild(remoteDebugBox);
            }
            var line = document.createElement('div');
            line.textContent = message;
            remoteDebugBox.appendChild(line);
            while (remoteDebugBox.childNodes.length > 100) remoteDebugBox.removeChild(remoteDebugBox.firstChild);
            remoteDebugBox.scrollTop = remoteDebugBox.scrollHeight;
        }
        if (cfg.toTerminal) {
            // Fire-and-forget -- a failed/slow request here should never
            // block or affect whatever's actually being debugged. No
            // response handling needed, the point is purely the server-side
            // console.log this triggers (see server.js's /debug-log route).
            var aiCfg = window.DisplayConfig.aiInfo;
            fetch(aiCfg.proxyBaseUrl + '/debug-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            }).catch(function () {});
        }
    }

    function focusAlbum() {
        albumFocused = true;
        albumInfoOverlay.classList.add('focused'); // ring lives on the correctly-sized overlay, not #albumart's taller container
    }

    function unfocusAlbum() {
        albumFocused = false;
        albumInfoOverlay.classList.remove('focused');
    }

    // ---- #centralInfoPanel: focus ring (outer Coda<->Niente<->InfoBox
    // ring, only reachable while infoBoxOpen is true) ----------------------
    // Deliberately separate from infoBoxOpen (panel visibility): these two
    // toggle independently (see the Enter handler further below, which
    // clears only the ring and reveals the bar, leaving the panel open).
    function focusInfoBox() {
        infoBoxFocused = true;
        centralInfoPanel.classList.add('focused');
    }

    function unfocusInfoBox() {
        infoBoxFocused = false;
        centralInfoPanel.classList.remove('focused');
    }

    // Worst case on the server side: a single generateAIText call can now
    // make up to two full provider calls back to back -- the normal
    // attempt, then one automatic retry if the first came back as
    // invalid JSON (ai.js's own retry, added after "content not
    // available then a manual Refresh works" kept happening). With web
    // search involved, each of those two calls can take up to
    // WEB_SEARCH_TIMEOUT_MS (90s server-side, ai.js) on its own -- so the
    // client needs to tolerate roughly double what it used to, not just
    // a single call's worth, or it gives up and shows "Content not
    // available" while the server is still legitimately working (Enrico:
    // this exact sequence, on "so vives pra lua" with web search always
    // on). 190s covers 2 x 90s plus margin for the network hop.
    var AI_TIMEOUT_MS = 190000;

    function activeProviderId() {
        if (selectedProviderId) return selectedProviderId;
        return aiProviders.length ? aiProviders[0].id : null; // first configured provider = default, per PROVIDER_DEFS order server-side
    }

    // Mirrors btnQueue's own .active toggle (openQueue/closeQueue) -- same
    // blue highlight, same idea: shows which of Artist/Album/Composition
    // (if any) is the one currently open. Only one can be active at a
    // time, since infoBoxKind is a single value.
    function updateCentralInfoButtonActiveState() {
        btnArtist.classList.toggle('active', infoBoxOpen && infoBoxKind === 'artist');
        btnAlbumReview.classList.toggle('active', infoBoxOpen && infoBoxKind === 'review');
        btnComposition.classList.toggle('active', infoBoxOpen && infoBoxKind === 'composition');
        // Only meaningful while something is open -- see togglePromptView's
        // own guard, which already no-ops with nothing open; this just
        // makes that visible too (same lightweight pattern already used
        // for remoteBtnPrevious/Next's disabled state: visual only, no
        // special D-pad skip logic, the real guard lives in the handler).
        document.getElementById('remoteBtnPrompt').classList.toggle('disabled', !infoBoxOpen);
    }

    function toggleCentralInfoPanel(kind) {
        if (infoBoxOpen && infoBoxKind === kind) {
            closeCentralInfoPanel();
            return;
        }
        // Either opening fresh, or switching which kind is shown while
        // already open (e.g. Recensione -> Composizione without closing
        // first) -- both cases just (re)render in place.
        infoBoxKind = kind;
        infoBoxOpen = true;
        centralInfoPanel.classList.add('visible');
        updateCentralInfoButtonActiveState();
        refreshCentralInfoPanel();
    }

    function closeCentralInfoPanel() {
        infoBoxOpen = false;
        centralInfoPanel.classList.remove('visible');
        updateCentralInfoButtonActiveState();
        if (infoBoxFocused) unfocusInfoBox(); // defensive -- normally not reachable at the same time (see focusInfoBox's own comment)
        // Prompt view is a per-open-session overlay, not something that
        // should carry over into the next thing opened (var declarations
        // for these three are hoisted, defined further down alongside
        // renderCentralInfoPanel -- safe to reference here since this only
        // ever runs from a user action, well after the whole script has
        // executed once).
        promptViewActive = false;
        lastInfoBoxData = null;
        disambiguationCandidates = null;
        disambiguationContext = null;
        document.getElementById('remoteBtnPrompt').classList.remove('active');
    }

    // Single source of truth for the cache key shape, shared by
    // refreshCentralInfoPanel() and selectRefreshOption() so the Refresh
    // dropdown always busts the exact entry that's actually showing.
    // - review: per-ALBUM (provider::artist::album::review)
    // - composition: per-TRACK (provider::artist::album::track::composition)
    // - artist: per-ARTIST NAME only (provider::artist::<name>::artist) --
    //   deliberately ignores album/track entirely, so the same artist's
    //   info is reused across every album/track by them.

    // Fetches (with in-memory caching) and renders the current kind's text.
    // Deliberately NOT re-run on every track change -- only when the panel
    // is (re)opened or the AI agent selection changes, per request
    // ("rimane invariato" while the track changes within the same album).
    function refreshCentralInfoPanel(forceRefresh, forceWebSearch, clear, disambiguationChoice) {
        // Opening fresh, switching which kind is shown, or refreshing --
        // all three should land on the real content, not silently stay on
        // whatever the prompt view was showing a moment ago.
        if (promptViewActive) {
            promptViewActive = false;
            document.getElementById('remoteBtnPrompt').classList.remove('active');
        }
        // A disambiguation choice is a deliberate second call for the same
        // item already on screen -- never coincides with switching kind or
        // reopening from scratch, so clearing any leftover pick-list here
        // is safe and just defensive.
        disambiguationCandidates = null;
        var isArtist = infoBoxKind === 'artist';
        var names = currentAlbumArtistTrackNames();
        // "composition si riferisce al brano": Composition's title/subject
        // is the currently-playing TRACK. Artist's is the picked artist
        // name (selectedArtistName, set by openArtistInfo -- not
        // necessarily the same as Roon's raw names.artist string when
        // there were multiple artists to choose from). Album's stays the
        // album, as before.
        var isComposition = infoBoxKind === 'composition';
        var titleLabel = isArtist ? 'Artist' : (isComposition ? 'Composition' : 'Album');
        var titleName = isArtist ? selectedArtistName : (isComposition ? names.track : names.album);
        centralInfoPanelTitle.textContent = titleName ? (titleLabel + ' \u2014 ' + titleName) : titleLabel;

        var missingRequired = isArtist
            ? !selectedArtistName
            : (isComposition ? (!names.artist || !names.track) : (!names.artist || !names.album));
        if (missingRequired) {
            centralInfoPanelFields.classList.remove('visible');
            centralInfoPanelBody.textContent = 'Nothing is playing.';
            centralInfoPanelSource.textContent = '';
            return;
        }

        ensureAiProvidersLoaded().then(function () {
            var providerId = activeProviderId();
            if (!providerId) {
                centralInfoPanelFields.classList.remove('visible');
                centralInfoPanelBody.textContent = 'No AI agent configured';
                centralInfoPanelSource.textContent = '';
                return;
            }

            var kindAtRequestTime = infoBoxKind;

            centralInfoPanelFields.classList.remove('visible');
            centralInfoPanelBody.textContent = 'Generating...';
            centralInfoPanelSource.textContent = '';

            fetchCentralInfoText(kindAtRequestTime, providerId, names, forceRefresh, forceWebSearch, clear, disambiguationChoice).then(function (data) {
                if (!data) return; // error already shown by fetchCentralInfoText
                // Guard against a slow response landing after the panel was
                // closed or switched to the other kind while in flight.
                if (infoBoxOpen && infoBoxKind === kindAtRequestTime) {
                    if (data.ambiguous) {
                        renderDisambiguationCandidates(data.candidates, names, kindAtRequestTime);
                    } else {
                        renderCentralInfoPanel(data, names);
                    }
                }
            });
        });
    }

    function fetchCentralInfoText(kind, providerId, names, forceRefresh, forceWebSearch, clear, disambiguationChoice) {
        var aiCfg = window.DisplayConfig.aiInfo;
        var url, body;
        if (kind === 'artist') {
            url = aiCfg.proxyBaseUrl + aiCfg.artistPath;
            body = { artist: selectedArtistName, provider: providerId, forceRefresh: !!forceRefresh, forceWebSearch: !!forceWebSearch, clear: !!clear, disambiguationChoice: disambiguationChoice };
        } else if (kind === 'review') {
            url = aiCfg.proxyBaseUrl + aiCfg.reviewPath;
            // Primary artist only (see primaryArtistName's own comment) --
            // the full Roon string can include per-track songwriter
            // credits that vary across an album's own tracks, which both
            // confused the review's own per-album cache identity and sent
            // a misleadingly composer-heavy "artist" into the AI prompt
            // for what's meant to be a review of the performer's album.
            body = { artist: primaryArtistName(names.artist), album: names.album, provider: providerId, forceRefresh: !!forceRefresh, forceWebSearch: !!forceWebSearch, clear: !!clear, disambiguationChoice: disambiguationChoice };
        } else {
            url = aiCfg.proxyBaseUrl + aiCfg.compositionPath;
            // Composition keeps the full raw string, composer credits and
            // all -- unlike review, that context is exactly what a piece-
            // level composition discussion benefits from, and composition
            // is already cached per-TRACK so it isn't vulnerable to the
            // same "varies across an album's tracks" cache problem anyway.
            body = { artist: names.artist, album: names.album, track: names.track, provider: providerId, forceRefresh: !!forceRefresh, forceWebSearch: !!forceWebSearch, clear: !!clear, disambiguationChoice: disambiguationChoice };
        }
        return fetchWithTimeout(url, AI_TIMEOUT_MS, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).catch(function (err) {
            centralInfoPanelBody.textContent = 'Content not available.';
            centralInfoPanelSource.textContent = '';
            console.warn('[central-info] ' + kind + ' fetch failed:', err && err.message);
            return null;
        });
    }

    // All three kinds show the fields block, but Artist only uses two rows
    // (Active/Country) -- field3 (Genre/Style) is hidden for it, shown for
    // Album/Composition. "Artists" for Album comes from Roon's own
    // now-playing metadata (names.artist, exact) rather than the AI.
    // Stashed here (not re-fetched) so togglePromptView() can show/restore
    // instantly -- both the client-cache-hit and fresh-fetch call sites
    // funnel through this same function with the same data shape, so this
    // is the one place that needs to remember it.
    var lastInfoBoxData = null;
    var lastInfoBoxTitle = '';
    var promptViewActive = false;

    // Renders the candidate pick-list into the panel body in place of the
    // normal review/text/bio content -- reuses .aiAgentRow/.rowFocused
    // (same classes the AI Agent and Artist dropdowns already use) so
    // this looks visually consistent without new CSS. A final "None of
    // these" entry is always appended (never sent by the server itself)
    // so there's always a way forward if none of the proposed candidates
    // are right.
    function renderDisambiguationCandidates(candidates, names, kindAtRequestTime) {
        // Two fallback entries, always appended last (never sent by the
        // server itself): "best guess" forces a real second generation
        // (disambiguationChoice: 'NONE'), "stop" does nothing at all --
        // no second request, no cost -- for when none of the proposals
        // are right and a guess isn't wanted either.
        disambiguationCandidates = (candidates || []).concat([
            'None of these \u2014 best guess anyway',
            'None of these \u2014 stop, don\'t generate'
        ]);
        disambiguationFocusIndex = 0;
        disambiguationContext = { names: names, kind: kindAtRequestTime };
        centralInfoPanelFields.classList.remove('visible');
        centralInfoPanelSource.textContent = '';
        renderDisambiguationList();
    }

    function renderDisambiguationList() {
        centralInfoPanelBody.innerHTML = '';
        disambiguationCandidates.forEach(function (candidate, i) {
            var row = document.createElement('div');
            row.className = 'aiAgentRow' + (i === disambiguationFocusIndex ? ' rowFocused' : '');
            row.textContent = candidate;
            row.addEventListener('click', function () {
                disambiguationFocusIndex = i;
                selectDisambiguationCandidate();
            });
            centralInfoPanelBody.appendChild(row);
        });
    }

    // Loops (modulo), matching every other focus-move pattern in this
    // file (refresh/AI Agent/artist dropdowns) rather than clamping at
    // the edges.
    function moveDisambiguationFocus(delta) {
        var n = disambiguationCandidates.length;
        disambiguationFocusIndex = ((disambiguationFocusIndex + delta) % n + n) % n;
        renderDisambiguationList();
    }

    function selectDisambiguationCandidate() {
        // Capture everything needed BEFORE clearing state below -- once
        // disambiguationCandidates is nulled out, its contents are gone.
        var n = disambiguationCandidates.length;
        var isStopOption = disambiguationFocusIndex === n - 1;
        var isBestGuessOption = disambiguationFocusIndex === n - 2;
        var chosenText = disambiguationCandidates[disambiguationFocusIndex];
        var context = disambiguationContext;
        disambiguationCandidates = null;
        disambiguationContext = null;

        if (isStopOption) {
            // No request at all -- this is the one candidate-list outcome
            // that costs nothing and generates nothing.
            centralInfoPanelBody.textContent = 'Generation cancelled.';
            centralInfoPanelSource.textContent = '';
            return;
        }
        if (!context) return; // defensive -- shouldn't happen, selectDisambiguationCandidate is only reachable while context is set
        var choice = isBestGuessOption ? 'NONE' : chosenText;
        // Re-enters through refreshCentralInfoPanel itself (not a
        // standalone fetch) so this gets the exact same "Generating..."
        // placeholder, provider lookup, and stale-response guard as any
        // other refresh -- the only difference is disambiguationChoice
        // riding along in the request body.
        refreshCentralInfoPanel(false, false, false, choice);
    }

    function renderCentralInfoPanel(data, names) {
        disambiguationCandidates = null; // defensive -- real content should never render while a pick-list is showing
        if (promptViewActive) {
            // Doesn't touch lastInfoBoxData/lastInfoBoxTitle -- those stay
            // pointed at the real content underneath, so toggling back
            // restores it without a fetch.
            centralInfoPanelFields.classList.remove('visible');
            var kindLabel = infoBoxKind === 'artist' ? 'Artist' : (infoBoxKind === 'composition' ? 'Composition' : 'Album');
            centralInfoPanelTitle.textContent = 'Prompt - ' + kindLabel;
            var promptBase = lastInfoBoxData && lastInfoBoxData.promptBase;
            if (promptBase) {
                var promptStyle = lastInfoBoxData.promptStyle;
                centralInfoPanelBody.textContent = 'Base:\n' + promptBase + '\n\nStyle additions:\n' + (promptStyle || '(none)');
            } else {
                centralInfoPanelBody.textContent = '(no prompt recorded for this text -- either it predates this feature, or it was cleared rather than generated; refresh it to record one)';
            }
            centralInfoPanelSource.textContent = '';
            centralInfoPanel.scrollTop = 0;
            return;
        }
        lastInfoBoxData = data;
        centralInfoPanelFields.classList.add('visible');
        if (infoBoxKind === 'artist') {
            centralInfoPanelField1Label.textContent = 'Timeline:';
            centralInfoPanelField1Value.textContent = data.active || '\u2014';
            centralInfoPanelField2Label.textContent = 'Country:';
            centralInfoPanelField2Value.textContent = data.country || '\u2014';
            centralInfoPanelField3Row.style.display = 'none';
            centralInfoPanelBody.textContent = data.bio || '';
        } else if (infoBoxKind === 'composition') {
            centralInfoPanelField1Label.textContent = 'Composer:';
            centralInfoPanelField1Value.textContent = data.composer || '\u2014';
            centralInfoPanelField2Label.textContent = 'Year:';
            centralInfoPanelField2Value.textContent = data.year || '\u2014';
            centralInfoPanelField3Row.style.display = '';
            centralInfoPanelField3Label.textContent = 'Genre/Style:';
            centralInfoPanelField3Value.textContent = data.style || '\u2014';
            centralInfoPanelBody.textContent = data.text || '';
        } else {
            centralInfoPanelField1Label.textContent = 'Artists:';
            centralInfoPanelField1Value.textContent = (names && names.artist) || '\u2014';
            centralInfoPanelField2Label.textContent = 'Release Year:';
            centralInfoPanelField2Value.textContent = data.year || '\u2014';
            centralInfoPanelField3Row.style.display = '';
            centralInfoPanelField3Label.textContent = 'Genre/Style:';
            centralInfoPanelField3Value.textContent = data.style || '\u2014';
            centralInfoPanelBody.textContent = data.review || '';
        }
        var src = data.source;
        var sourceLine;
        if (src) {
            sourceLine = 'Source: ' + src.label + ' (' + src.model + ')';
            // data.searchCount (how many separate searches the model actually
            // ran) and data.sources (the web-search domains, when any) are
            // both separate from data.source (which AI provider/model
            // generated the text). Two distinct phrasings depending on
            // whether any searching happened at all -- most generations have
            // webSearch.mode == 'never' server-side (searchCount 0), so
            // "based on training data" is the common case in practice.
            // Whole line shares one style (#centralInfoPanelSource, see its
            // own comment).
            var searchCount = data.searchCount || 0;
            if (searchCount === 0) {
                sourceLine += ' \u2014 based on training data';
            } else {
                var searchCountLabel = searchCount === 1 ? '1 search' : (searchCount + ' searches');
                sourceLine += ' \u2014 enriched with ' + searchCountLabel;
                if (data.sources && data.sources.length) {
                    sourceLine += ' \u2014 ' + data.sources.join(', ');
                }
            }
            // data.fromCache: true means the proxy served this from its own
            // server-side cache (ai-cache.json) instead of generating it
            // fresh just now -- appended last, regardless of which branch
            // above ran, so it always reads as a final annotation on the
            // whole line rather than competing with the search-count wording.
            if (data.fromCache) {
                sourceLine += ' (cached)';
            }
            if (data.createdAt) {
                var genDate = new Date(data.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                sourceLine += ' \u2014 generated ' + genDate;
            }
            // Grouped separately at the very end of the line, after
            // everything else (Enrico: "raggruppata e spostata al fondo") --
            // deliberately distinct from "enriched with N searches" earlier
            // in this same line, which describes only the LAST attempt (the
            // content actually shown). This is the real total: every retry
            // (ai.js's whenUseful escalation, domain-filter fallback, and the
            // invalid-JSON retry) fully replaces the previous attempt rather
            // than merging with it, so a discarded attempt's own searches
            // were still paid for even though nothing about them survives
            // into what's on screen (Enrico: "pago per tentativo e per
            // search").
            if (data.totalAttempts) {
                var attemptsLabel = data.totalAttempts === 1 ? '1 attempt' : (data.totalAttempts + ' attempts');
                var searchesLabel = data.totalSearchCount === 1 ? '1 search' : (data.totalSearchCount + ' searches');
                sourceLine += ' \u2014 Total cost: ' + attemptsLabel + ', ' + searchesLabel;
            }
        } else {
            // Manually-cleared placeholder (Refresh dropdown's "Clear") --
            // no provider, no searches, no real attempts to report, so this
            // replaces the WHOLE line rather than let empty/zeroed fields
            // from the normal branch leak through (Enrico: "sostituire
            // tutto il testo con 'content cleared'"). Date kept alongside
            // it (Enrico: "mettimi la data accanto"), since knowing WHEN it
            // was cleared is still useful.
            sourceLine = 'Content cleared.';
            if (data.createdAt) {
                var clearedDate = new Date(data.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                sourceLine += ' \u2014 generated ' + clearedDate;
            }
        }
        centralInfoPanelSource.textContent = sourceLine;
        lastInfoBoxTitle = centralInfoPanelTitle.textContent; // captured AFTER refreshCentralInfoPanel already set it (runs before this function)
        centralInfoPanel.scrollTop = 0; // reset scroll position on new content, same idea as toggleAlbumInfo's fresh-open behavior
    }

    // Toggles between the real content (Album/Composition/Artist, whatever
    // is currently open) and a plain view of the exact prompt sent to the
    // AI for it -- purely client-side, no fetch, since the prompt already
    // arrived embedded in the same response (see ai.js/generateAIText's
    // own comment on why it's stored in the cache entry too, not just
    // returned fresh). No-op if nothing is open at all.
    function togglePromptView() {
        if (!infoBoxOpen) return;
        promptViewActive = !promptViewActive;
        document.getElementById('remoteBtnPrompt').classList.toggle('active', promptViewActive);
        if (!promptViewActive) centralInfoPanelTitle.textContent = lastInfoBoxTitle;
        renderCentralInfoPanel(lastInfoBoxData || {}, currentAlbumArtistTrackNames());
    }

    // Scrolls #centralInfoPanel's own overflow (native scrollTop, no custom
    // row bookkeeping needed like the queue's moveRowFocus -- this is plain
    // text, not a list). Clamps at the edges, no wrap, per request.
    var CENTRAL_INFO_SCROLL_STEP_VH = 4; // roughly two lines of body text per press
    function scrollCentralInfoPanel(direction) {
        var stepPx = CENTRAL_INFO_SCROLL_STEP_VH * window.innerHeight / 100;
        var max = centralInfoPanel.scrollHeight - centralInfoPanel.clientHeight;
        var next = centralInfoPanel.scrollTop + direction * stepPx;
        centralInfoPanel.scrollTop = Math.max(0, Math.min(next, max));
    }

    // ---- AI agent dropdown (#aiAgentDropdown) -----------------------------
    // getAvailableProviders() server-side already filters to configured
    // providers in PROVIDER_DEFS order -- this list IS the dropdown order
    // and index 0 IS the default, no separate default logic needed here.
    function ensureAiProvidersLoaded() {
        if (aiProvidersFetched) return Promise.resolve();
        var aiCfg = window.DisplayConfig.aiInfo;
        return fetchWithTimeout(aiCfg.proxyBaseUrl + aiCfg.providersPath, AI_TIMEOUT_MS)
            .then(function (r) { return r.ok ? r.json() : { providers: [] }; })
            .then(function (data) {
                aiProviders = data.providers || [];
                aiProvidersFetched = true;
            })
            .catch(function (err) {
                console.warn('[ai] could not load providers:', err && err.message);
                aiProviders = [];
                aiProvidersFetched = true; // avoid hammering the proxy on every open after a real failure -- retried fresh on next page load
            });
    }

    function findProviderIndex(providerId) {
        for (var i = 0; i < aiProviders.length; i++) {
            if (aiProviders[i].id === providerId) return i;
        }
        return -1;
    }

    function renderAiAgentDropdownList() {
        aiAgentDropdownList.innerHTML = '';
        aiProviders.forEach(function (p, i) {
            var row = document.createElement('div');
            row.className = 'aiAgentRow' + (i === aiFocusIndex ? ' rowFocused' : '');

            var check = document.createElement('span');
