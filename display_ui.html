            check.className = 'aiAgentRowCheck' + (p.id === activeProviderId() ? ' selected' : '');
            check.textContent = '\u2713';

            var label = document.createElement('span');
            label.textContent = p.label;

            row.appendChild(check);
            row.appendChild(label);
            row.addEventListener('click', function () {
                aiFocusIndex = i;
                selectAiProvider();
            });
            aiAgentDropdownList.appendChild(row);
        });
    }

    function armAiHideTimer() {
        clearTimeout(aiHideTimer);
        aiHideTimer = setTimeout(closeAiAgentDropdown, _remoteCfg.barAutoHideMs); // same auto-hide timeout as the control bar itself, per request
    }

    function openAiAgentDropdown() {
        ensureAiProvidersLoaded().then(function () {
            var hasProviders = aiProviders.length > 0;
            aiAgentDropdownEmpty.style.display = hasProviders ? 'none' : 'block';
            aiAgentDropdownList.style.display = hasProviders ? 'block' : 'none';
            aiAgentDropdown.classList.add('visible');

            if (hasProviders) {
                var currentIdx = findProviderIndex(activeProviderId());
                aiFocusIndex = currentIdx >= 0 ? currentIdx : 0;
                renderAiAgentDropdownList();
            }
            // Always enter this zone, even with an empty list -- Up/Down
            // and Enter are no-ops then (moveAiFocus/selectAiProvider both
            // guard on aiProviders.length), but Left/Right still closes it
            // the same way in either case, so "No AI agent configured"
            // never gets stuck open.
            focusZone = 'aiDropdown';
            clearTimeout(hideTimer); // suspend the control bar's OWN auto-hide while this sub-focus is active -- resumed by closeAiAgentDropdown()
            armAiHideTimer();
        });
    }

    function closeAiAgentDropdown() {
        clearTimeout(aiHideTimer);
        aiHideTimer = null;
        aiAgentDropdown.classList.remove('visible');
        if (focusZone === 'aiDropdown') focusZone = 'bar';
        showControlBar(); // resumes the bar's own auto-hide timer and keeps the ring on the AI agent button (focusedRow/focusedCol never left it)
    }

    function moveAiFocus(delta) {
        var total = aiProviders.length;
        if (total === 0) return;
        aiFocusIndex = ((aiFocusIndex + delta) % total + total) % total; // true loop (modulo), not clamp -- per request
        renderAiAgentDropdownList();
        armAiHideTimer(); // any interaction renews the auto-hide window, same pattern as showControlBar()
    }

    function selectAiProvider() {
        var picked = aiProviders[aiFocusIndex];
        if (!picked) return;
        selectedProviderId = picked.id;
        renderAiAgentDropdownList(); // moves the check mark; dropdown stays open per request
        armAiHideTimer();
        // Deliberately does NOT refresh the already-open panel -- used to
        // (Enrico: switching the model while the track had changed
        // underneath triggered an unwanted generation for the NEW track,
        // not the one being looked at). The new agent takes effect on the
        // next real action instead (Refresh, opening a new track, etc.),
        // never as a side effect of just picking it from this dropdown.
    }

    // ---- Refresh dropdown (#refreshDropdown) -------------------------------
    // Two fixed options, no server round-trip needed to populate this one
    // (unlike the AI agent list) -- see REFRESH_OPTIONS above for what each
    // does. No checkmark either: this isn't a persistent selection like the
    // AI agent picker, each choice is a one-shot action.
    function renderRefreshDropdownList() {
        refreshDropdownList.innerHTML = '';
        REFRESH_OPTIONS.forEach(function (opt, i) {
            var row = document.createElement('div');
            row.className = 'aiAgentRow' + (i === refreshFocusIndex ? ' rowFocused' : '');
            row.textContent = opt.label;
            row.addEventListener('click', function () {
                refreshFocusIndex = i;
                selectRefreshOption();
            });
            refreshDropdownList.appendChild(row);
        });
    }

    function armRefreshHideTimer() {
        clearTimeout(refreshHideTimer);
        refreshHideTimer = setTimeout(closeRefreshDropdown, _remoteCfg.barAutoHideMs); // same auto-hide timeout as the control bar itself, same pattern as the AI agent dropdown
    }

    function openRefreshDropdown() {
        refreshFocusIndex = 0; // always defaults to "Cache", per request
        renderRefreshDropdownList();
        refreshDropdown.classList.add('visible');
        focusZone = 'refreshDropdown';
        clearTimeout(hideTimer); // suspend the control bar's OWN auto-hide while this sub-focus is active -- resumed by closeRefreshDropdown()
        armRefreshHideTimer();
    }

    function closeRefreshDropdown() {
        clearTimeout(refreshHideTimer);
        refreshHideTimer = null;
        refreshDropdown.classList.remove('visible');
        if (focusZone === 'refreshDropdown') focusZone = 'bar';
        showControlBar(); // resumes the bar's own auto-hide timer and keeps the ring on the Refresh button (focusedRow/focusedCol never left it)
    }

    function moveRefreshFocus(delta) {
        var total = REFRESH_OPTIONS.length;
        refreshFocusIndex = ((refreshFocusIndex + delta) % total + total) % total; // true loop (modulo), same as the AI agent dropdown
        renderRefreshDropdownList();
        armRefreshHideTimer();
    }

    // forceRefresh controls whether the SERVER bypasses ai-cache.json --
    // there's no client-side cache anymore to separately worry about
    // bypassing (removed, see the comment where aiTextCache used to be
    // declared).
    function selectRefreshOption() {
        var picked = REFRESH_OPTIONS[refreshFocusIndex];
        if (!picked) return;
        closeRefreshDropdown();
        if (!infoBoxOpen) return;
        var providerId = activeProviderId();
        if (!providerId) return;
        var forceRefresh = picked.id === 'web' || picked.id === 'forceWeb';
        var forceWebSearch = picked.id === 'forceWeb';
        var clear = picked.id === 'clear';
        refreshCentralInfoPanel(forceRefresh, forceWebSearch, clear);
    }

    // ---- Artist button (row2, right after Queue) --------------------------
    // Roon only gives us a single formatted display string for the artist
    // (three_line.line2) -- there is no structured multi-performer list in
    // this Zone API. Multiple artists show up combined into that one
    // string (e.g. "Miles Davis, John Coltrane"), so splitting on common
    // separators is the only way to offer a picker. Deliberately NOT
    // splitting on "and"/"with" -- too many real act names contain those
    // words (e.g. "Above & Beyond" is fine since that's "&", but "Emerson,
    // Lake and Palmer" would wrongly split "Lake and Palmer" further) --
    // under-splitting (missed multi-artist case) is a safer failure mode
    // here than over-splitting a single act's name into fragments.
    function splitArtistNames(artistString) {
        if (!artistString) return [];
        return artistString.split(/\s*(?:,|&|\/|;|\bfeat\.?\b|\bft\.?\b)\s*/i)
            .map(function (s) { return s.trim(); })
            .filter(function (s) { return s.length > 0; });
    }

    // For album-review purposes specifically (cache identity AND what's
    // sent to the AI) -- Roon's three_line.line2 often combines the
    // actual performer with per-TRACK songwriter/composer credits (e.g.
    // "Stacey Kent / Leonard Bernstein / Betty Comden / Jim Tomlinson"),
    // which genuinely differs from track to track on the very same album
    // since different songs have different writers. Using the raw string
    // as-is meant every track on an album with this credit style got its
    // own review cache entry and its own (confusingly composer-focused)
    // AI prompt, despite review being meant as per-ALBUM. Taking just the
    // first split name is a reasonable proxy for "the performer" without
    // needing to know Roon's exact composer-vs-performer convention.
    function primaryArtistName(artistString) {
        var split = splitArtistNames(artistString);
        return split[0] || artistString;
    }

    function renderArtistDropdownList() {
        artistDropdownList.innerHTML = '';
        artistOptions.forEach(function (name, i) {
            var row = document.createElement('div');
            row.className = 'aiAgentRow' + (i === artistFocusIndex ? ' rowFocused' : ''); // reuses the AI dropdown's row styling -- same visual, no check mark needed here
            row.textContent = name;
            row.addEventListener('click', function () {
                artistFocusIndex = i;
                selectArtistFromDropdown();
            });
            artistDropdownList.appendChild(row);
        });
    }

    function armArtistHideTimer() {
        clearTimeout(artistHideTimer);
        artistHideTimer = setTimeout(closeArtistDropdown, _remoteCfg.barAutoHideMs); // same auto-hide window as the control bar and the AI dropdown
    }

    function openArtistDropdown(options) {
        artistOptions = options;
        artistFocusIndex = 0;
        renderArtistDropdownList();
        artistDropdown.classList.add('visible');
        focusZone = 'artistDropdown';
        clearTimeout(hideTimer); // suspend the control bar's OWN auto-hide while this sub-focus is active -- resumed by closeArtistDropdown()
        armArtistHideTimer();
    }

    function closeArtistDropdown() {
        clearTimeout(artistHideTimer);
        artistHideTimer = null;
        artistDropdown.classList.remove('visible');
        if (focusZone === 'artistDropdown') focusZone = 'bar';
        showControlBar(); // resumes the bar's own auto-hide timer and keeps the ring on the Artist button
    }

    function moveArtistFocus(delta) {
        var total = artistOptions.length;
        if (total === 0) return;
        artistFocusIndex = ((artistFocusIndex + delta) % total + total) % total; // true loop, same as the AI dropdown
        renderArtistDropdownList();
        armArtistHideTimer();
    }

    // Picking from the dropdown navigates straight to that artist and
    // closes the picker -- unlike the AI agent dropdown, there's no
    // "stays open" preference to set here.
    function selectArtistFromDropdown() {
        var picked = artistOptions[artistFocusIndex];
        if (!picked) return;
        closeArtistDropdown();
        openArtistInfo(picked);
    }

    // Row2's Artist button: single artist on the current track -> straight
    // to their info (toggling closed on a second press, like Album/
    // Composition do). Multiple artists -> always (re)opens the picker,
    // even if the panel is already showing one of them, so you can switch.
    function handleArtistButtonPress() {
        // Checked FIRST, unconditionally -- mirrors toggleCentralInfoPanel's
        // own pattern for Album/Composition (press the same button again
        // to close, full stop, regardless of whether the underlying
        // identity changed since it was opened). Two bugs this fixes at
        // once: (1) the multi-artist branch below used to run every time
        // regardless of whether the panel was already open, so it could
        // never be reached to close from a multi-artist track; (2) the old
        // close check additionally required selectedArtistName to still
        // exactly match the current track's parsed artist name, which
        // could silently fail (leaving no way to close at all) if the
        // track changed slightly in the meantime. Trade-off: switching
        // directly to a DIFFERENT one of several credited artists while
        // already viewing one now takes a close-then-reopen (two presses)
        // instead of one -- closing reliably matters more.
        if (infoBoxOpen && infoBoxKind === 'artist') {
            closeCentralInfoPanel();
            return;
        }
        var names = currentAlbumArtistTrackNames();
        var options = splitArtistNames(names.artist);
        if (options.length > 1) {
            openArtistDropdown(options);
            return;
        }
        var only = options[0] || names.artist;
        if (!only) return; // nothing playing / no artist metadata at all
        openArtistInfo(only);
    }

    function openArtistInfo(artistName) {
        selectedArtistName = artistName;
        infoBoxKind = 'artist';
        infoBoxOpen = true;
        centralInfoPanel.classList.add('visible');
        updateCentralInfoButtonActiveState();
        refreshCentralInfoPanel();
    }

    // Roon's three_line is Title/Artist/Album, in that order -- confirmed by
    // a Roon Labs community thread (the previous version of this had album
    // and artist swapped/wrong, which is why searches kept matching an
    // album whose title equaled the *track* title instead of the album).
    function currentAlbumArtistTrackNames() {
        var zone = currentZone();
        var tl = zone && zone.now_playing && zone.now_playing.three_line;
        return {
            track: (tl && tl.line1) || '',
            artist: (tl && tl.line2) || '',
            album: (tl && tl.line3) || ''
        };
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : s;
        return d.innerHTML;
    }

    function renderAlbumInfo(html) {
        albumInfoContent.innerHTML = html;
    }

    // ---- Fuzzy matching helpers for picking the right iTunes result ----
    // iTunes' own `term` search already does some fuzzy word matching, but
    // just taking result[0] regularly returns the wrong edition (a compi-
    // lation, a "Greatest Hits" that happens to share a word, etc.). These
    // score each candidate against what Roon actually reported, so we can
    // pick the best of several instead of trusting result order blindly.
    function normalizeForMatch(s) {
        return (s || '')
            .toLowerCase()
            .replace(/\[[^\]]*\]|\([^)]*\)/g, '') // strip "(Remastered)", "(Deluxe Edition)", "(Live)" etc. for comparison purposes only
            .replace(/[^a-z0-9]+/g, ' ')
            .trim();
    }

    function similarity(a, b) {
        a = normalizeForMatch(a);
        b = normalizeForMatch(b);
        if (!a || !b) return 0;
        if (a === b) return 1;
        if (a.indexOf(b) !== -1 || b.indexOf(a) !== -1) return 0.7;
        var at = a.split(' ');
        var bt = b.split(' ');
        var common = at.filter(function (t) { return bt.indexOf(t) !== -1; }).length;
        return common / Math.max(at.length, bt.length);
    }

    // A candidate is rejected outright below this artist similarity,
    // regardless of how well the track/album title matches -- a common
    // song title (a jazz/bossa nova standard, a "Vol. 1" compilation, etc.)
    // can otherwise score high on title alone and outweigh a completely
    // wrong artist in the weighted sum below.
    var MIN_ARTIST_SIMILARITY = window.DisplayConfig.albumInfo.minArtistSimilarity;

    // Symmetric to the above: a candidate is also rejected outright below
    // this title similarity, regardless of how well the artist matches.
    // Without this, a prolific artist's OTHER album/track (perfect artist
    // score) could still win purely on the artist weight even with zero
    // words in common in the title itself.
    var MIN_TITLE_SIMILARITY = window.DisplayConfig.albumInfo.minTitleSimilarity;

    function pickBestAlbum(results, wantArtist, wantAlbum) {
        var best = null, bestScore = 0;
        (results || []).forEach(function (r) {
            var artistScore = similarity(r.artistName, wantArtist);
            var albumScore = similarity(r.collectionName, wantAlbum);
            if (artistScore < MIN_ARTIST_SIMILARITY || albumScore < MIN_TITLE_SIMILARITY) return;
            var score = artistScore * 0.4 + albumScore * 0.6;
            if (score > bestScore) { bestScore = score; best = r; }
        });
        return bestScore >= 0.4 ? { item: best, score: bestScore } : null; // loose threshold -- good enough to reject wildly wrong picks
    }

    function pickBestSong(results, wantArtist, wantTrack, wantAlbum) {
        var best = null, bestScore = 0;
        (results || []).forEach(function (r) {
            var artistScore = similarity(r.artistName, wantArtist);
            var trackScore = similarity(r.trackName, wantTrack);
            if (artistScore < MIN_ARTIST_SIMILARITY || trackScore < MIN_TITLE_SIMILARITY) return;
            var score = artistScore * 0.3 +
                trackScore * 0.4 +
                similarity(r.collectionName, wantAlbum) * 0.3;
            if (score > bestScore) { bestScore = score; best = r; }
        });
        return bestScore >= 0.35 ? { item: best, score: bestScore } : null;
    }

    function itunesSearch(term, entity) {
        return fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(term) + '&entity=' + entity + '&limit=5')
            .then(function (r) { return r.json(); })
            .then(function (data) { return data.results || []; });
    }

    // Confirms/upgrades a song-derived match to full album-level data
    // (genre, release date, label) via a proper album lookup by id, rather
    // than reading those fields off the song result (some are missing or
    // track-specific there).
    function lookupAlbumById(collectionId) {
        return fetch('https://itunes.apple.com/lookup?id=' + collectionId + '&entity=album')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var results = data.results || [];
                for (var i = 0; i < results.length; i++) {
                    if (results[i].wrapperType === 'collection') return results[i];
                }
                return results[0] || null;
            });
    }

    // Every provider below is normalized into this common shape before it
    // reaches renderAlbumInfoResult, so rendering/caching don't need to know
    // which provider a result came from -- only `source` carries that,
    // displayed as a small credit line in the panel, alongside `confidence`
    // (the picker's own match score, 0-1, turned into a rounded percentage).
    function normalizeItunesResult(result, score) {
        if (!result) return null;
        return {
            source: 'iTunes',
            name: result.collectionName,
            artist: result.artistName,
            year: result.releaseDate ? result.releaseDate.slice(0, 4) : null,
            genre: result.primaryGenreName || null,
            label: result.copyright || null,
            confidence: Math.round(score * 100)
        };
    }

    // ---- Deezer fallback (JSONP) ----
    // Deezer's API sends no CORS headers for direct browser fetch(), but
    // Deezer's own docs recommend JSONP as the workaround (a <script> tag
    // isn't subject to CORS at all) -- so this stays 100% client-side, no
    // proxy needed, same as the iTunes calls above.
    var jsonpCounter = 0;
    function jsonp(url) {
        return new Promise(function (resolve, reject) {
            var callbackName = 'albumInfoJsonp' + (jsonpCounter++);
            var script = document.createElement('script');
            var timeoutId = setTimeout(function () {
                cleanup();
                reject(new Error('jsonp timeout'));
            }, 6000);
            function cleanup() {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                clearTimeout(timeoutId);
            }
            window[callbackName] = function (data) {
                cleanup();
                resolve(data);
            };
            script.onerror = function () {
                cleanup();
                reject(new Error('jsonp script error'));
            };
            script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'output=jsonp&callback=' + callbackName;
            document.body.appendChild(script);
        });
    }

    function pickBestDeezerAlbum(results, wantArtist, wantAlbum) {
        var best = null, bestScore = 0;
        var closestRejected = null, closestRejectedScore = -1;
        (results || []).forEach(function (r) {
            var artistScore = similarity(r.artist && r.artist.name, wantArtist);
            var albumScore = similarity(r.title, wantAlbum);
            var score = artistScore * 0.4 + albumScore * 0.6;
            if (artistScore < MIN_ARTIST_SIMILARITY || albumScore < MIN_TITLE_SIMILARITY) {
                if (score > closestRejectedScore) {
                    closestRejectedScore = score;
                    closestRejected = { title: r.title, artistScore: artistScore, albumScore: albumScore };
                }
                return;
            }
            if (score > bestScore) { bestScore = score; best = r; }
        });
        if (!best && closestRejected) albumInfoDebugLog('[deezer] closest candidate rejected by threshold:', closestRejected);
        return bestScore >= 0.4 ? { item: best, score: bestScore } : null;
    }

    function findAlbumInfoFromDeezer(artist, album) {
        var searchTerm = artist + ' ' + album;
        albumInfoDebugLog('[deezer] album search:', searchTerm);
        return jsonp('https://api.deezer.com/search/album?q=' + encodeURIComponent(searchTerm))
            .then(function (data) {
                var results = (data && data.data) || [];
                albumInfoDebugLog('[deezer] search returned', results.length, 'candidate(s):', results.map(function (r) { return r.title; }));
                return pickBestDeezerAlbum(results, artist, album);
            })
            .then(function (picked) {
                if (!picked) { albumInfoDebugLog('[deezer] no candidate cleared the threshold'); return null; }
                albumInfoDebugLog('[deezer] picked "' + picked.item.title + '" score', picked.score);
                return jsonp('https://api.deezer.com/album/' + picked.item.id) // full record -- search results alone lack genre/label
                    .then(function (full) { return { full: full, score: picked.score }; });
            })
            .then(function (result) {
                if (!result || !result.full) return null;
                var full = result.full;
                var genre = full.genres && full.genres.data && full.genres.data[0] && full.genres.data[0].name;
                return {
                    source: 'Deezer',
                    name: full.title,
                    artist: full.artist && full.artist.name,
                    year: full.release_date ? full.release_date.slice(0, 4) : null,
                    genre: genre || null,
                    label: full.label || null,
                    confidence: Math.round(result.score * 100)
                };
            })
            .catch(function (err) {
                albumInfoDebugLog('[deezer] request failed:', err && err.message);
                return null; // JSONP failure (timeout, script error) -- just no Deezer result
            });
    }

    // ---- Discogs (via the Cloudflare Worker proxy, see
    // discogs-proxy-worker.js) ----
    // Unlike iTunes/Deezer, this is entirely optional: DisplayConfig.
    // albumInfo.discogsProxyUrl is empty by default (see its comment above),
    // so anyone using this script without setting up their own Worker/token
    // just falls straight through to iTunes below -- no failed request, no
    // console noise, findAlbumInfoFromDiscogs() resolves to null immediately.
    function parseDiscogsTitle(title) {
        // Discogs search results give a single "Artist - Album" string, no
        // separate fields -- split on the first " - ", which is Discogs'
        // own convention for this title format.
        var idx = (title || '').indexOf(' - ');
        if (idx === -1) return { artist: '', album: title || '' };
        return { artist: title.slice(0, idx), album: title.slice(idx + 3) };
    }

    function pickBestDiscogsRelease(results, wantArtist, wantAlbum) {
        var best = null, bestScore = 0;
        var closestRejected = null, closestRejectedScore = -1; // diagnostics only, even when below threshold
        (results || []).forEach(function (r) {
            var parsed = parseDiscogsTitle(r.title);
            var artistScore = similarity(parsed.artist, wantArtist);
            var albumScore = similarity(parsed.album, wantAlbum);
            var score = artistScore * 0.4 + albumScore * 0.6;
            if (artistScore < MIN_ARTIST_SIMILARITY || albumScore < MIN_TITLE_SIMILARITY) {
                if (score > closestRejectedScore) {
                    closestRejectedScore = score;
                    closestRejected = { title: r.title, artistScore: artistScore, albumScore: albumScore };
                }
                return;
            }
            if (score > bestScore) { bestScore = score; best = r; }
        });
        if (!best && closestRejected) {
            albumInfoDebugLog('[discogs] closest candidate rejected by threshold:', closestRejected);
        }
        return bestScore >= 0.4 ? { item: best, score: bestScore } : null;
    }

    function normalizeDiscogsResult(full, score) {
        if (!full) return null;
        var artist = full.artists && full.artists[0] && full.artists[0].name;
        var label = full.labels && full.labels[0] && full.labels[0].name;
        var genre = (full.genres && full.genres[0]) || (full.styles && full.styles[0]) || null;
        var rating = full.community && full.community.rating && full.community.rating.average;
        var ratingCount = full.community && full.community.rating && full.community.rating.count;
        return {
            source: 'Discogs',
            name: full.title,
            artist: artist,
            year: full.year ? String(full.year) : null,
            genre: genre,
            label: label,
            confidence: Math.round(score * 100),
            rating: rating || null,
            ratingCount: ratingCount || null,
            popularity: (full.community && full.community.have) || null
        };
    }

    // Explicit timeout for the Discogs calls -- unlike Deezer's JSONP (which
    // already has its own 6s timeout), a plain fetch() has none, so on a
    // slower/flakier connection (e.g. the TV's own Wi-Fi/network path to an
    // external workers.dev domain, vs. testing from Safari on the Mac) a
    // request can hang long enough that behavior looks inconsistent between
    // devices for no visible reason. Fails fast and logs which step timed
    // out instead.
    var DISCOGS_TIMEOUT_MS = 8000;
    function fetchWithTimeout(url, ms, options) {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, ms);
        // Manual merge instead of Object.assign (ES5-compatible, per this
        // project's WebView constraint) -- options is optional, existing
        // GET-only callers (2-arg) keep working unchanged.
        var opts = {};
        if (options) {
            for (var k in options) { if (options.hasOwnProperty(k)) opts[k] = options[k]; }
        }
        opts.signal = controller.signal;
        return fetch(url, opts).finally(function () { clearTimeout(timer); });
    }

    // Global backoff after a 429: once Discogs has told us we're rate
    // limited, further requests before this timestamp are pointless (same
    // 60 req/min window) -- skip Discogs entirely and go straight to the
    // next source instead of spending more of an already-exhausted quota.
    // Uses the Retry-After header if the Worker forwards it (see
    // discogs-proxy-worker.js), otherwise a conservative 60s default.
    var discogsBackoffUntil = 0;
    var DISCOGS_DEFAULT_BACKOFF_MS = 60000;

    function applyDiscogsBackoff(response) {
        var retryAfterHeader = response.headers.get('Retry-After');
        var seconds = retryAfterHeader ? parseInt(retryAfterHeader, 10) : NaN;
        var ms = (!isNaN(seconds) && seconds > 0) ? seconds * 1000 : DISCOGS_DEFAULT_BACKOFF_MS;
        discogsBackoffUntil = Date.now() + ms;
        albumInfoDebugLog('[discogs] rate limited (429) -- backing off for', Math.round(ms / 1000) + 's',
            retryAfterHeader ? '(from Retry-After header)' : '(no Retry-After header from the Worker, using default)');
    }

    // Logs the REAL quota tier Discogs assigned this token (via the Worker
    // forwarding X-Discogs-Ratelimit*), instead of assuming the documented
    // 60/min -- a malformed User-Agent is a known cause of silently getting
    // a much lower tier (some report 25, even 6), so this makes it visible
    // rather than guessed.
    function logDiscogsRatelimit(response) {
        var total = response.headers.get('X-Discogs-Ratelimit');
        if (!total) return; // Worker not updated yet, or header absent
        var used = response.headers.get('X-Discogs-Ratelimit-Used');
        var remaining = response.headers.get('X-Discogs-Ratelimit-Remaining');
        albumInfoDebugLog('[discogs] quota: ' + used + '/' + total + ' used this minute, ' + remaining + ' remaining');
    }

    function findAlbumInfoFromDiscogs(artist, album) {
        var proxyBase = window.DisplayConfig.albumInfo && window.DisplayConfig.albumInfo.discogsProxyUrl;
        if (!proxyBase) { albumInfoDebugLog('[discogs] discogsProxyUrl not set, skipping'); return Promise.resolve(null); }
        if (Date.now() < discogsBackoffUntil) {
            albumInfoDebugLog('[discogs] still backing off after a recent 429, skipping for another', Math.ceil((discogsBackoffUntil - Date.now()) / 1000) + 's');
            return Promise.resolve(null);
        }
        var searchUrl = proxyBase + '/search?q=' + encodeURIComponent(artist + ' ' + album);
        albumInfoDebugLog('[discogs] album search:', artist + ' ' + album);
        return fetchWithTimeout(searchUrl, DISCOGS_TIMEOUT_MS)
            .then(function (r) {
                albumInfoDebugLog('[discogs] search HTTP', r.status, searchUrl);
                logDiscogsRatelimit(r);
                if (r.status === 429) { applyDiscogsBackoff(r); return null; }
                if (!r.ok) { albumInfoDebugLog('[discogs] search failed with HTTP', r.status); return null; }
                return r.json();
            })
            .then(function (data) {
                if (!data) return null; // 429/non-ok, already logged above
                if (data.error) { albumInfoDebugLog('[discogs] proxy/Discogs error payload:', data.error); return null; }
                var results = data.results || [];
                albumInfoDebugLog('[discogs] search returned', results.length, 'candidate(s):', results.map(function (r) { return r.title; }));
                return pickBestDiscogsRelease(results, artist, album);
            })
            .then(function (picked) {
                if (!picked) { albumInfoDebugLog('[discogs] no candidate cleared the threshold'); return null; }
                albumInfoDebugLog('[discogs] picked "' + picked.item.title + '" score', picked.score);
                return fetchWithTimeout(proxyBase + '/release/' + picked.item.id, DISCOGS_TIMEOUT_MS) // full record -- search results alone lack community rating/label
                    .then(function (r) {
                        albumInfoDebugLog('[discogs] release HTTP', r.status);
                        logDiscogsRatelimit(r);
                        if (r.status === 429) { applyDiscogsBackoff(r); return null; }
                        if (!r.ok) { albumInfoDebugLog('[discogs] release lookup failed with HTTP', r.status); return null; }
                        return r.json();
                    })
                    .then(function (full) { return full ? normalizeDiscogsResult(full, picked.score) : null; });
            })
            .catch(function (err) {
                var isTimeout = err && err.name === 'AbortError';

                albumInfoDebugLog('[discogs] request failed:', isTimeout ? ('timed out after ' + DISCOGS_TIMEOUT_MS + 'ms') : (err && err.message));
                return null; // Worker unreachable/misconfigured/too slow -- just fall through to the next source
            });
    }

    // iTunes: search the album directly by artist+album, and if nothing
    // scores well (wrong artist, ambiguous title, etc.) search by
    // artist+track(+album) instead -- a specific track title is often a
    // much less ambiguous search term than an album title alone -- using
    // that song's own reported collection, upgraded to full album data.
    function findAlbumInfoFromItunes(artist, album, track) {
        var albumTerm = artist + ' ' + album;
        albumInfoDebugLog('[itunes] album search:', albumTerm);
        return itunesSearch(albumTerm, 'album').then(function (albumResults) {
            albumInfoDebugLog('[itunes] album search returned', albumResults.length, 'candidate(s):', albumResults.map(function (r) { return r.collectionName; }));
            var best = pickBestAlbum(albumResults, artist, album);
            if (best) {
                albumInfoDebugLog('[itunes] album match:', best.item.collectionName, 'score', best.score);
                return normalizeItunesResult(best.item, best.score);
            }
            albumInfoDebugLog('[itunes] no album candidate cleared the threshold, trying song fallback');
            var songTerm = artist + ' ' + track + (album ? ' ' + album : '');
            return itunesSearch(songTerm, 'song').then(function (songResults) {
                albumInfoDebugLog('[itunes] song search returned', songResults.length, 'candidate(s):', songResults.map(function (r) { return r.trackName; }));
                var songBest = pickBestSong(songResults, artist, track, album);
                if (!songBest || !songBest.item.collectionId) {
                    albumInfoDebugLog('[itunes] no song candidate cleared the threshold either');
                    return null;
                }
                albumInfoDebugLog('[itunes] song match:', songBest.item.trackName, 'score', songBest.score, '-> looking up its album', songBest.item.collectionId);
                return lookupAlbumById(songBest.item.collectionId).then(function (full) {
                    return normalizeItunesResult(full, songBest.score);
                });
            });
        });
    }

    // Dispatch table for DisplayConfig.albumInfo.sourceOrder. Each entry
    // takes (artist, album, track) and resolves to a normalized result or
    // null; findAlbumInfoFromDeezer/FromDiscogs only need (artist, album)
    // but are called with all three for a uniform signature.
    var ALBUM_INFO_SOURCES = {
        discogs: findAlbumInfoFromDiscogs,
        itunes: function (artist, album, track) { return findAlbumInfoFromItunes(artist, album, track); },
        deezer: function (artist, album) { return findAlbumInfoFromDeezer(artist, album); }
    };

    // Tries each source in DisplayConfig.albumInfo.sourceOrder, in order,
    // stopping at the first one that resolves to a match. An empty
    // sourceOrder disables album info lookups entirely (no requests at
    // all). This is what makes "is Discogs really matching, or is iTunes
    // quietly winning every time" answerable: set sourceOrder to just
    // ['discogs'] (or ['itunes'], etc.) to isolate one source, with debug:
    // true to see its reasoning.
    function findAlbumInfo(artist, album, track) {
        var cfg = window.DisplayConfig.albumInfo || {};
        var order = cfg.sourceOrder || [];
        albumInfoDebugLog('query:', { artist: artist, album: album, track: track, sourceOrder: order });
        if (!order.length) {
            albumInfoDebugLog('sourceOrder is empty -- album info disabled, no sources tried');
            return Promise.resolve(null);
        }
        return order.reduce(function (chain, sourceName) {
            return chain.then(function (result) {
                if (result) return result; // already matched by an earlier source -- short-circuit the rest
                var fn = ALBUM_INFO_SOURCES[sourceName];
                if (!fn) {
                    albumInfoDebugLog('unknown source "' + sourceName + '" in sourceOrder -- skipping');
                    return null;
                }
                albumInfoDebugLog('trying source:', sourceName);
                return fn(artist, album, track).then(function (r) {
                    if (r) { albumInfoDebugLog('source "' + sourceName + '" matched:', r); return r; }
                    albumInfoDebugLog('source "' + sourceName + '" found nothing, falling through');
                    return null;
                });
            });
        }, Promise.resolve(null));
    }

    // applyAlbumBackgroundColor (cover-art average sampling) removed --
    // reverted to the flat dimmingOverlayColor already set in CSS, per
    // Enrico's request. See refreshAlbumInfo's own comment.

    function renderAlbumInfoResult(result) {
        if (!result) {
            renderAlbumInfo('<p class="albumInfoFallback">Album not found.</p>');
            return;
        }
        // No structured "live" field from either source (see prior discussion) —
        // heuristic on the album title, same caveat as any string match.
        var isLive = /\(live[^)]*\)|\blive\b/i.test(result.name || '');
        var html = '<h2>' + escapeHtml(result.name) + '</h2>'
            + '<p class="albumInfoArtist">' + escapeHtml(result.artist) + '</p>';
        if (result.year) html += '<p><span class="albumInfoLabel">Year</span>' + result.year + '</p>';
        if (result.genre) html += '<p><span class="albumInfoLabel">Genre</span>' + escapeHtml(result.genre) + '</p>';
        if (result.label) html += '<p><span class="albumInfoLabel">Label</span>' + escapeHtml(result.label) + '</p>';
        if (result.rating) {
            html += '<p><span class="albumInfoLabel">Rating</span>' + result.rating.toFixed(1) + '/5' +
                (result.ratingCount ? ' (' + result.ratingCount + ')' : '') + '</p>';
        }
        if (isLive) html += '<p class="albumInfoLive">LIVE</p>';
        if (result.source) {
            html += '<p class="albumInfoSource">Source: ' + escapeHtml(result.source) +
                (result.confidence != null ? ', ' + result.confidence + '% match' : '') + '.</p>';
        }
        renderAlbumInfo(html);
    }

    // During debug, re-searching on every single toggle (rather than just
    // once) is what makes the trace trustworthy -- but rapid back-and-forth
    // clicking on the same album doesn't need a fresh network round-trip
    // each time. This caps how often debug will actually bypass the cache
    // for the SAME album; well within it, the cached result is served
    // (and still logged as such) instead of spending more Discogs quota.
    var DEBUG_RESEARCH_COOLDOWN_MS = 30000;
    var albumInfoLastSearchAt = {}; // cache key -> timestamp of last real (non-cached) search

    function fetchAlbumInfo(artist, album, track) {
        var key = (artist + '|' + album).toLowerCase();
        var cfg = window.DisplayConfig.albumInfo || {};
        if (albumInfoCache.hasOwnProperty(key)) {
            var msSinceLastSearch = Date.now() - (albumInfoLastSearchAt[key] || 0);
            var withinCooldown = msSinceLastSearch < DEBUG_RESEARCH_COOLDOWN_MS;
            if (!cfg.debug || withinCooldown) {
                if (cfg.debug) {
                    albumInfoDebugLog('cache hit for "' + key + '" within ' + Math.round(DEBUG_RESEARCH_COOLDOWN_MS / 1000) + 's cooldown -- serving cached result, not re-searching');
                }
                renderAlbumInfoResult(albumInfoCache[key]);
                return;
            }
            // debug=true and the cooldown has elapsed: bypass the cache (still
            // overwritten below) so debugging periodically re-runs the full
            // chain instead of trusting a result that might now be stale.
            albumInfoDebugLog('cache has an entry for "' + key + '" but debug=true and cooldown elapsed -- bypassing it and re-searching');
        }
        renderAlbumInfo(''); // blank while loading -- avoids a flash of stale info from the previous album
        albumInfoLastSearchAt[key] = Date.now();
        findAlbumInfo(artist, album, track)
            .then(function (result) {
                albumInfoCache[key] = result;
                renderAlbumInfoResult(result);
            })
            .catch(function () {
                albumInfoCache[key] = null;
                renderAlbumInfoResult(null);
            });
    }

    function refreshAlbumInfo() {
        var zone = currentZone();
        lastAlbumInfoFingerprint = nowPlayingFingerprint(zone);
        // Background color no longer sampled from the cover art (see
        // applyAlbumBackgroundColor's removal below) -- reverted to the
        // flat dimmingOverlayColor already set in CSS (Enrico: use the
        // same dark color as "il secondo colore impostato in Look and
        // Feel", i.e. Dimming overlay color, the field right below Accent
        // color).
        var names = currentAlbumArtistTrackNames();
        fetchAlbumInfo(names.artist, names.album, names.track);
    }

    function toggleAlbumInfo() {
        albumInfoOpen = !albumInfoOpen;
        albumInfoContent.classList.toggle('open', albumInfoOpen);
        if (albumInfoOpen) refreshAlbumInfo();
    }

    function secondsToTimeString(totalSeconds) {
        if (totalSeconds == null || isNaN(totalSeconds)) return '';
        totalSeconds = Math.max(0, Math.round(totalSeconds));
        var h = Math.floor(totalSeconds / 3600);
        var m = Math.floor((totalSeconds % 3600) / 60);
        var s = totalSeconds % 60;
        var mm = (h > 0 && m < 10) ? '0' + m : '' + m;
        var ss = s < 10 ? '0' + s : '' + s;
        return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
    }

    // The Roon extension API's queue subscription only ever contains the
    // now-playing track (item 0) plus upcoming items — it has no concept of
    // already-played history, so that part of the reference screenshot isn't
    // reproducible here. We fetch a generous cap so the whole upcoming queue
    // loads (list scrolls naturally rather than being truncated).
    var QUEUE_FETCH_MAX = 200;

    function nowPlayingFingerprint(zone) {
        if (!zone || !zone.now_playing) return null;
        var np = zone.now_playing;
        var line = (np.three_line && np.three_line.line1) || (np.two_line && np.two_line.line1) || '';
        return line + '|' + np.length;
    }

    var queueRowElements = []; // [{ el, item }] for keyboard/remote navigation + click-to-play
    var rowFocusIndex = 0;
    var headerIconFocusIndex = 2; // which of the 3 header icons (0=loop, 1=shuffle, 2=radio) has the ring when rowFocusIndex === -1
    var rowHighlightVisible = true; // toggled by Left/Right, and auto-hidden after ROW_HIGHLIGHT_TIMEOUT
    var rowHighlightHideTimer = null;
    // Queue row-highlight ("focus bar") persistence: how long the grey
    // highlight box stays visible on the selected track before fading away
    // on its own. rowFocusIndex is remembered either way, so pressing
    // Left/Right afterward brings the highlight straight back on the same row.
    var ROW_HIGHLIGHT_TIMEOUT = 10000;

    // Single point of control for the row-highlight box's visibility, so the
    // auto-hide timer stays consistent no matter what triggers a show/hide.
    function setRowHighlightVisible(visible) {
        rowHighlightVisible = visible;
        applyRowFocusClass();
        clearTimeout(rowHighlightHideTimer);
        rowHighlightHideTimer = visible ? setTimeout(function () {
            setRowHighlightVisible(false);
        }, ROW_HIGHLIGHT_TIMEOUT) : null;
    }

    function playQueueItem(item) {
        var zone = currentZone();
        if (zone && window.roonCore && item && item.queue_item_id != null) {
            window.roonCore.services.RoonApiTransport.play_from_here(zone, item.queue_item_id);
        } else {
            console.warn('[remote-control] could not play queue item — roonCore:',
                !!window.roonCore, 'zone:', zone, 'queue_item_id:', item && item.queue_item_id);
        }
    }

    function renderQueue(items, zone) {
        queueList.innerHTML = '';
        queueRowElements = [];

        if (!items || items.length === 0) {
            var empty = document.createElement('div');
            empty.id = 'queuePanelEmpty';
            empty.textContent = 'Queue is empty';
            queueList.appendChild(empty);
            return;
        }

        // Item 0 is the currently playing track (Roon queue convention);
        // cross-check against zone.now_playing so we degrade gracefully
        // (no false "current" highlight) if that ever isn't the case.
        var firstLine = (items[0].three_line && items[0].three_line.line1) ||
                        (items[0].two_line && items[0].two_line.line1) || '';
        var zoneNowPlayingLine = zone && zone.now_playing &&
            ((zone.now_playing.three_line && zone.now_playing.three_line.line1) ||
             (zone.now_playing.two_line && zone.now_playing.two_line.line1)) || '';
        var hasCurrent = !!zoneNowPlayingLine && firstLine === zoneNowPlayingLine;

        var isPlayingNow = !!zone && (zone.state === 'playing' || zone.state === 'loading');

        items.forEach(function (item, index) {
            var row = document.createElement('div');
            row.className = 'queueItem' + (hasCurrent && index === 0 ? ' current' : '');
            row.tabIndex = 0;
            row.addEventListener('click', function () {
                focusZone = 'queue';
                clearAllButtonFocus();
                setRowFocus(index);
                playQueueItem(item);
            });

            var eqSlot = document.createElement('div');
            eqSlot.className = 'queueEqSlot';
            if (hasCurrent && index === 0) {
                var eq = document.createElement('div');
                eq.className = 'queueEqIcon';
                eq.style.animationPlayState = isPlayingNow ? 'running' : 'paused';
                for (var b = 0; b < 3; b++) {
                    var bar = document.createElement('span');
                    bar.style.animationPlayState = isPlayingNow ? 'running' : 'paused';
                    eq.appendChild(bar);
                }
                eqSlot.appendChild(eq);
            }
            row.appendChild(eqSlot);

            var art = document.createElement('div');
            art.className = 'queueItemArt';
            var url = imageUrl(item.image_key, 120);
            if (url) art.style.backgroundImage = "url('" + url + "')";
            row.appendChild(art);

            var textWrap = document.createElement('div');
            textWrap.className = 'queueItemText';

            var line1 = (item.three_line && item.three_line.line1) ||
                       (item.two_line && item.two_line.line1) ||
                       (item.one_line && item.one_line.line1) || '';
            var subline = (item.three_line && item.three_line.line2) ||
                          (item.two_line && item.two_line.line2) || '';

            var title = document.createElement('div');
            title.className = 'queueItemTitle';
            title.textContent = line1;
            textWrap.appendChild(title);

            if (subline) {
                var sub = document.createElement('div');
                sub.className = 'queueItemSubtitle';
                sub.textContent = subline;
                textWrap.appendChild(sub);
            }

            row.appendChild(textWrap);

            var duration = document.createElement('div');
            duration.className = 'queueItemDuration';
            duration.textContent = secondsToTimeString(item.length);
            row.appendChild(duration);

            queueList.appendChild(row);
            queueRowElements.push({ el: row, item: item });
        });

        // Default scroll position: current track pinned to the top (nothing
        // to reveal above it, since history isn't available — see note above).
        queueList.scrollTop = 0;
        rowFocusIndex = 0;
        setRowHighlightVisible(true);
        recomputeQueueScrollMetrics();
    }

    function applyRowFocusClass() {
        var show = focusZone === 'queue' && rowHighlightVisible;
        queueRowElements.forEach(function (entry, i) {
            entry.el.classList.toggle('rowFocused', show && i === rowFocusIndex);
        });
        var onHeaderRow = show && rowFocusIndex === -1;
        if (queuePanelLoopIcon) {
            queuePanelLoopIcon.classList.toggle('rowFocused', onHeaderRow && headerIconFocusIndex === 0);
        }
        if (queuePanelShuffleIcon) {
            queuePanelShuffleIcon.classList.toggle('rowFocused', onHeaderRow && headerIconFocusIndex === 1);
        }
        if (queuePanelRadioIcon) {
            queuePanelRadioIcon.classList.toggle('rowFocused', onHeaderRow && headerIconFocusIndex === 2);
        }
    }

    // queueWindowStart = logical index of whichever row currently sits at
    // the very top of the visible list (-1 = the radio icon, at the very
    // top of everything). This is persistent state, not recomputed — it
    // only ever changes by exactly +/-1, in lockstep with rowFocusIndex,
    // which is what keeps the highlighted row's on-screen position pinned
    // during the "scroll" phase with zero drift between clicks.
    var queueWindowStart = -1;
    var cachedRowHeight = 60;
    var cachedCenterSlot = 0; // how many slots the highlight can move through before scrolling kicks in

    // Measured once per render, never during navigation — recomputing this
    // on every keypress was the likely cause of the earlier jump, since
    // clientHeight/offsetHeight can have tiny frame-to-frame variance under
    // vh units, which could flip the result by one row unpredictably.
    function recomputeQueueScrollMetrics() {
        var sample = queueRowElements[0] && queueRowElements[0].el;
        cachedRowHeight = sample ? sample.offsetHeight : 60;
        cachedCenterSlot = Math.max(0, Math.floor((queueList.clientHeight / cachedRowHeight) / 2));
        queueWindowStart = -1;
    }

    function applyQueueScrollTop() {
        var targetTop;
        if (queueWindowStart <= -1) {
            targetTop = 0;
        } else {
            var entry = queueRowElements[Math.min(queueWindowStart, queueRowElements.length - 1)];
            targetTop = entry ? entry.el.offsetTop : queueWindowStart * cachedRowHeight;
        }
        queueList.scrollTop = targetTop;
    }

    // Direct jump to a specific row (mouse click, initial entry) — not part
    // of an incremental up/down sequence, so a one-time resync is fine here.
    function setRowFocus(index) {
        var maxIndex = queueRowElements.length - 1;
        rowFocusIndex = Math.max(-1, Math.min(index, maxIndex));
        queueWindowStart = Math.max(-1, rowFocusIndex - cachedCenterSlot);
        setRowHighlightVisible(true);
        applyQueueScrollTop();
    }

    // The actual mutually-exclusive step logic: for this one click, either
    // the highlight moves (list untouched) or the list scrolls by exactly
    // one row (highlight's on-screen slot untouched) — never both.
    function moveRowFocus(delta) {
        var maxIndex = queueRowElements.length - 1;
        var newIndex = Math.max(-1, Math.min(rowFocusIndex + delta, maxIndex));
        if (newIndex === rowFocusIndex) return; // already at an edge

        if (newIndex === -1) headerIconFocusIndex = 2; // landing on the header row always starts on the radio icon

        if (delta > 0) {
            var slotBeforeMove = rowFocusIndex - queueWindowStart;
            rowFocusIndex = newIndex;
            if (slotBeforeMove >= cachedCenterSlot) {
                queueWindowStart += 1; // scroll the list; highlight's slot stays put
                applyQueueScrollTop();
            }
            // else: just let the highlight move — nothing else to do
        } else {
            rowFocusIndex = newIndex;
            if (queueWindowStart > -1) {
                queueWindowStart -= 1; // scroll the list; highlight's slot stays put
                applyQueueScrollTop();
            }
            // else: already showing from the top — just let the highlight move
        }

        setRowHighlightVisible(true);
    }

    // Called when Up/Down/Enter are pressed while the queue's row-highlight
    // is toggled off ("silent"). Hands keyboard focus to the bar and reveals
    // it — the queue panel itself stays open/visible throughout.
    function exitQueueFocusToBar() {
        focusZone = 'bar';
        setRowHighlightVisible(false);
        showControlBar();
        applyBarFocusVisual();
    }

    // Called by Left/Right when the bar is hidden and the queue is open:
    // toggles keyboard focus in/out of the queue itself (not its open/closed
    // panel state, which stays exclusively controlled by the Queue button).
    function toggleQueueFocusFromNeutral() {
        if (focusZone === 'queue') {
            // Remove focus from the queue back to true neutral.
            focusZone = 'bar';
            setRowHighlightVisible(false);
        } else {
            // Give focus to the queue, landing on the now-playing row.
            focusZone = 'queue';
            clearAllButtonFocus();
            setRowFocus(0);
        }
    }

    // Used by the outer Album <-> Niente <-> Coda loop's track-row
    // transitions (see the ArrowLeft/ArrowRight handling below). Unlike
    // toggleQueueFocusFromNeutral() above (used when first opening the
    // queue, or via Up/Down, which always lands on the now-playing row),
    // these two preserve whatever rowFocusIndex was last focused -- so
    // cycling out to niente/album and back resumes the SAME track instead
    // of jumping back to now-playing.
    function exitQueueToNiente() {
        focusZone = 'bar';
        setRowHighlightVisible(false);
    }

    function enterQueueAtRememberedRow() {
        focusZone = 'queue';
        clearAllButtonFocus();
        setRowHighlightVisible(true);
    }

    function activateFocusedRow() {
        if (rowFocusIndex === -1) {
            if (headerIconFocusIndex === 0) toggleLoop();
            else if (headerIconFocusIndex === 1) toggleShuffle();
            else toggleRoonRadio();
            return;
        }
        var entry = queueRowElements[rowFocusIndex];
        if (entry) playQueueItem(entry.item);
    }

    var queuePanelRemaining = document.getElementById('queuePanelRemaining');
    var queuePanelRadioIcon = document.getElementById('queuePanelRadioIcon');
    var queuePanelLoopIcon = document.getElementById('queuePanelLoopIcon');
    var queuePanelShuffleIcon = document.getElementById('queuePanelShuffleIcon');

    if (queuePanelRadioIcon) {
        queuePanelRadioIcon.addEventListener('click', function () {
            focusZone = 'queue';
            clearAllButtonFocus();
            headerIconFocusIndex = 2;
            setRowFocus(-1);
            toggleRoonRadio();
        });
    }

    // Repeat and Shuffle share the same header row (index -1) as the radio
    // icon — Left/Right cycles keyboard/remote focus between the three, so
    // clicking one should land the ring on that same icon too.
    if (queuePanelLoopIcon) {
        queuePanelLoopIcon.addEventListener('click', function () {
            focusZone = 'queue';
            clearAllButtonFocus();
            headerIconFocusIndex = 0;
            setRowFocus(-1);
            toggleLoop();
        });
    }
    if (queuePanelShuffleIcon) {
        queuePanelShuffleIcon.addEventListener('click', function () {
            focusZone = 'queue';
            clearAllButtonFocus();
            headerIconFocusIndex = 1;
            setRowFocus(-1);
            toggleShuffle();
        });
    }

    // These two zone fields (unlike the subscribe_queue payload, which is
    // capped at max_item_count) reflect Roon's own count/time for the WHOLE
    // queue, not just the visible rows.
    var queueTimeRemainingBase = null;   // seconds, as of queueTimeRemainingBaseAt
    var queueTimeRemainingBaseAt = 0;    // Date.now() when base was captured
    var queueItemsRemainingCount = null;
    var queueIsPlaying = false;
    var queueTickInterval = null;
    var radioActive = false;
    var shuffleActive = false;
    var loopState = 'disabled'; // 'disabled' | 'loop' | 'loop_one'

    // Decorative clock (top-right, hh:mm 24h, local device time). Purely
    // cosmetic -- no interaction, no dependency on Roon/zone state. Skips
    // starting the interval at all when disabled, not just hiding via CSS.
    (function initClockDisplay() {
        if (!window.DisplayConfig.clock || !window.DisplayConfig.clock.enabled) return;
        var clockEl = document.getElementById('clockDisplay');
        if (!clockEl) return;
        // Time digits are ALWAYS built by hand from getHours()/getMinutes()
        // below, never via toLocaleTimeString -- tried relying on that with
